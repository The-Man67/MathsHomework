<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d12;
    color: #ffffff;
}

header {
    background: #11151d;
    border-bottom: 1px solid #252b36;
    padding: 20px;
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 10px;
}

nav a {
    color: #ffffff;
    text-decoration: none;
    padding: 9px 14px;
    border-radius: 7px;
    background: #1a202b;
}

nav a:hover {
    background: #252d3b;
}

.page {
    max-width: 1500px;
    margin: auto;
    padding: 25px;
}

.layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 220px;
    gap: 20px;
    align-items: start;
}

.ads {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.ad {
    min-height: 180px;
    background: #11151d;
    border: 1px solid #252b36;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #656d7a;
    font-size: 13px;
}

.content {
    min-width: 0;
}

.hero {
    background: #11151d;
    border: 1px solid #252b36;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 20px;
}

.hero h1 {
    margin: 0 0 8px;
    font-size: 32px;
}

.hero p {
    margin: 0;
    color: #aeb6c4;
}

.redeem {
    background: #11151d;
    border: 1px solid #252b36;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.redeem h2 {
    margin-top: 0;
}

.redeem p {
    color: #aeb6c4;
}

.redeem-row {
    display: flex;
    gap: 10px;
}

.redeem input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border-radius: 7px;
    border: 1px solid #303846;
    background: #0b0d12;
    color: #ffffff;
    outline: none;
}

.redeem button {
    padding: 13px 18px;
    border: 0;
    border-radius: 7px;
    background: #ffffff;
    color: #000000;
    font-weight: bold;
    cursor: pointer;
}

.redeem button:hover {
    opacity: 0.85;
}

.result {
    margin-top: 12px;
    padding: 12px;
    background: #0b0d12;
    border-radius: 7px;
    color: #aeb6c4;
    display: none;
    word-break: break-word;
}

.games {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.game {
    background: #11151d;
    border: 1px solid #252b36;
    border-radius: 12px;
    padding: 18px;
}

.game h3 {
    margin-top: 0;
}

.game p {
    color: #aeb6c4;
    min-height: 45px;
}

.download {
    display: inline-block;
    padding: 10px 14px;
    background: #ffffff;
    color: #000000;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}

.download:hover {
    opacity: 0.85;
}

footer {
    max-width: 1500px;
    margin: 30px auto 0;
    padding: 20px 25px;
    color: #666f7e;
    text-align: center;
    border-top: 1px solid #252b36;
}

@media (max-width: 1000px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .ads {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
    }

    .games {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 650px) {
    .header-inner {
        flex-direction: column;
        align-items: flex-start;
    }

    .ads {
        grid-template-columns: 1fr;
    }

    .games {
        grid-template-columns: 1fr;
    }

    .redeem-row {
        flex-direction: column;
    }
}
</style>

</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">Game Hub</div>

```
    <nav>
        <a href="/">Home</a>
        <a href="#games">Games</a>
        <a href="#redeem">Redeem</a>
    </nav>
</div>
```

</header>

<div class="page">

```
<div class="layout">

    <aside class="ads">
        <div class="ad">Advertisement</div>
        <div class="ad">Advertisement</div>
        <div class="ad">Advertisement</div>
    </aside>

    <main class="content">

        <section class="hero">
```
