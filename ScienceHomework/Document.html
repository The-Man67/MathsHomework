function defaultSave() {

    return {
        tokens: 10,
        difficulty: 0,
        unlockedDifficulty: 0,
        currentRound: 1,
        redeemedCodes: []

function saveGame() {

    try {

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(save)

    } catch (error) {

    }

function loadSave() {

    try {

        const raw =
            localStorage.getItem(
                SAVE_KEY
            );


        if (!raw) {

            save =
                defaultSave();

            saveGame();

            return;

        }


        const parsed =
            JSON.parse(raw);


        save =
            defaultSave();


        if (
            Number.isFinite(
                parsed.tokens
            )
        ) {

            save.tokens =
                Math.max(
                    0,
                    Math.floor(
                        parsed.tokens
                    )
                );

        }


        if (
            Number.isFinite(
                parsed.difficulty
            )
        ) {

            save.difficulty =
                Math.max(
                    0,
                    Math.min(
                        2,
                        Math.floor(

        if (
            Number.isFinite(

function isValidCodeString(
    value,
    length
) {

    if (
        typeof value !==
        "string"
    ) {

        return false;

    }


    if (
        value.length !==
        length
    ) {

        return false;

    }


    for (
        const character of
        value
    ) {

        if (
            !CODE_ALPHABET.includes(
                character
            )
        ) {

            return false;

        }

    }


    return true;

}


function randomCodeString(
    length
) {

    let result =
        "";


    try {

        if (
            window.crypto &&
            window.crypto.getRandomValues
        ) {

            const values =
                new Uint32Array(
                    length
                );


            window.crypto.getRandomValues(
                values
            );


            for (
                let i = 0;
                i < length;
                i++
            ) {

                result +=
                    CODE_ALPHABET[
                        values[i] %
                        CODE_ALPHABET.length
                    ];

            }


            return result;

        }

    } catch (error) {

    }


    for (
        let i = 0;
        i < length;
        i++
    ) {

        result +=
            CODE_ALPHABET[
                Math.floor(
                    Math.random() *
                    CODE_ALPHABET.length
                )
            ];

    }


    return result;

}

/* =========================================================

const SHA256_K = [

function rightRotate(
    value,
    amount
) {

    return (
        value >>> amount
    ) |
    (
        value <<
        (
            32 -
            amount
        )
    );

}


function sha256Fallback(
    bytes
) {

    const bitLength =
        bytes.length * 8;


    const paddedLength =
        Math.ceil(
            (
                bytes.length +
                9
            ) / 64
        ) *
        64;


    const message =
        new Uint8Array(
            paddedLength
        );


    message.set(
        bytes
    );


    message[
        bytes.length
    ] =
        0x80;


    const high =
        Math.floor(
            bitLength /
            0x100000000
        );


    const low =
        bitLength >>> 0;


    message[
        paddedLength - 8
    ] =
        (
            high >>> 24
        ) &
        0xff;


    message[
        paddedLength - 7
    ] =
        (
            high >>> 16
        ) &
        0xff;


    message[
        paddedLength - 6
    ] =
        (
            high >>> 8
        ) &
        0xff;


    message[
        paddedLength - 5
    ] =
        high &
        0xff;


    message[
        paddedLength - 4
    ] =
        (
            low >>> 24
        ) &
        0xff;


    message[
        paddedLength - 3
    ] =
        (
            low >>> 16
        ) &
        0xff;


    message[
        paddedLength - 2
    ] =
        (
            low >>> 8
        ) &
        0xff;


    message[
        paddedLength - 1
    ] =
        low &
        0xff;


    let h0 =
        0x6a09e667;

    let h1 =
        0xbb67ae85;

    let h2 =
        0x3c6ef372;

    let h3 =
        0xa54ff53a;

    let h4 =
        0x510e527f;

    let h5 =
        0x9b05688c;

    let h6 =
        0x1f83d9ab;

    let h7 =
        0x5be0cd19;


    const w =
        new Uint32Array(
            64
        );


    for (
        let offset = 0;
        offset < paddedLength;
        offset += 64
    ) {

        for (
            let i = 0;
            i < 16;
            i++
        ) {

            const p =
                offset +
                i * 4;


            w[i] =
                (
                    message[p] << 24
                ) |
                (
                    message[p + 1] << 16
                ) |
                (
                    message[p + 2] << 8
                ) |
                message[p + 3];

        }


        for (
            let i = 16;
            i < 64;
            i++
        ) {

            const s0 =
                rightRotate(
                    w[i - 15],
                    7
                ) ^
                rightRotate(
                    w[i - 15],
                    18
                ) ^
                (
                    w[i - 15] >>> 3
                );


            const s1 =
                rightRotate(
                    w[i - 2],
                    17
                ) ^
                rightRotate(
                    w[i - 2],
                    19
                ) ^
                (
                    w[i - 2] >>> 10
                );


            w[i] =
                (
                    w[i - 16] +
                    s0 +
                    w[i - 7] +
                    s1
                ) >>> 0;

        }


        let a =
            h0;

        let b =
            h1;

        let c =
            h2;

        let d =
            h3;

        let e =
            h4;

        let f =
            h5;

        let g =
            h6;

        let h =
            h7;


        for (
            let i = 0;
            i < 64;
            i++
        ) {

            const S1 =
                rightRotate(
                    e,
                    6
                ) ^
                rightRotate(
                    e,
                    11
                ) ^
                rightRotate(
                    e,
                    25
                );


            const ch =
                (
                    e &
                    f
                ) ^
                (
                    (~e) &
                    g
                );


            const temp1 =
                (
                    h +
                    S1 +
                    ch +
                    SHA256_K[i] +
                    w[i]
                ) >>> 0;


            const S0 =
                rightRotate(
                    a,
                    2
                ) ^
                rightRotate(
                    a,
                    13
                ) ^
                rightRotate(
                    a,
                    22
                );


            const maj =
                (
                    a &
                    b
                ) ^
                (
                    a &
                    c
                ) ^
                (
                    b &
                    c
                );


            const temp2 =
                (
                    S0 +
                    maj
                ) >>> 0;


            h =
                g;

            g =
                f;

            f =
                e;

            e =
                (
                    d +
                    temp1
                ) >>> 0;

            d =
                c;

            c =
                b;

            b =
                a;

            a =
                (
                    temp1 +
                    temp2
                ) >>> 0;

        }


        h0 =
            (
                h0 +
                a
            ) >>> 0;

        h1 =
            (
                h1 +
                b
            ) >>> 0;

        h2 =
            (
                h2 +
                c
            ) >>> 0;

        h3 =
            (
                h3 +
                d
            ) >>> 0;

        h4 =
            (
                h4 +
                e
            ) >>> 0;

        h5 =
            (
                h5 +
                f
            ) >>> 0;

        h6 =
            (
                h6 +
                g
            ) >>> 0;

        h7 =
            (
                h7 +
                h
            ) >>> 0;

    }


    return [

        h0,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        h7

    ]
        .map(
            value =>
                value
                    .toString(16)
                    .padStart(
                        8,
                        "0"
                    )
        )
        .join("");

}


async function sha256(
    textValue
) {

    const bytes =
        new TextEncoder().encode(
            textValue
        );


    if (
        window.crypto &&
        window.crypto.subtle
    ) {

        try {

            const hash =
                await window.crypto.subtle.digest(
                    "SHA-256",
                    bytes
                );


            return Array
                .from(
                    new Uint8Array(
                        hash
                    )
                )
                .map(
                    byte =>
                        byte
                            .toString(16)
                            .padStart(
                                2,
                                "0"
                            )
                )
                .join("");

        } catch (error) {

        }

    }


    return sha256Fallback(
        bytes
    );

}


/* =========================================================
   CODE EQUATION
========================================================= */

function characterValue(
    character
) {

    const index =
        CODE_ALPHABET.indexOf(
            character
        );


    if (
        index < 0
    ) {

        return -1;

    }


    return index + 11;

}


function calculateEquation(
    value
) {

    const values = [];


    for (
        const character of
        value
    ) {

        const number =
            characterValue(
                character
            );


        if (
            number < 0
        ) {

            return null;

        }


        values.push(
            number
        );

    }


    if (
        values.length < 16
    ) {

        return null;

    }


    let a =
        values[0] *
        values[2];


    let b =
        values[1] +
        values[3];


    let c =
        values[4] *
        7;


    let d =
        values[5] +
        values[6];


    let e =
        (
            a +
            b
        ) *
        c;


    let f =
        e +
        d;


    let g =
        f *
        values[7];


    let h =
        g +
        values[8];


    let i =
        h *
        values[9];


    let j =
        i +
        values[10];


    let k =
        (
            j *
            values[11]
        ) +
        (
            j ^
            values[11]
        );


    k =
        Math.abs(
            k %
            1000000007
        );


    let l =
        k +
        values[12];


    let m =
        l *
        values[13];


    let n =
        m +
        values[14];


    let result =
        n *
        values[15];


    result =
        Math.abs(
            result %
            1000000007
        );


    return result;

}


/* =========================================================
   CODE A
========================================================= */

async function createCodeA() {

    if (
        codeAGenerating
    ) {

        return;

    }


    codeAGenerating =
        true;


    currentCodeA =
        "";

    currentRedemptionId =
        "";


    try {

        const redemptionId =
            randomCodeString(
                REDEMPTION_ID_LENGTH
            );


        const equation =
            calculateEquation(
                installationId +
                redemptionId
            );


        if (
            equation === null
        ) {

            throw new Error(
                "Equation error"
            );

        }


        const checksum =
            (
                await sha256(
                    installationId +
                    "|" +
                    redemptionId +
                    "|" +
                    equation
                )
            )
                .slice(
                    0,
                    16
                )
                .toUpperCase();


        currentRedemptionId =
            redemptionId;


        currentCodeA =
            CODE_A_PREFIX +
            "-" +
            installationId +
            "-" +
            redemptionId +
            "-" +
            checksum;


    } catch (error) {

        setMessage(
            "Could not create redemption code.",
            "error"
        );

    }


    codeAGenerating =
        false;

}


function parseCodeA(
    code
) {

    if (
        typeof code !== "string"
    ) {

        return null;

    }


    const cleaned =
        code
            .trim()
            .toUpperCase();


    const parts =
        cleaned.split("-");


    if (
        parts.length !== 4
    ) {

        return null;

    }


    if (
        parts[0] !== CODE_A_PREFIX
    ) {

        return null;

    }


    if (
        !isValidCodeString(
            parts[1],
            INSTALLATION_ID_LENGTH
        )
    ) {

        return null;

    }


    if (
        !isValidCodeString(
            parts[2],
            REDEMPTION_ID_LENGTH
        )
    ) {

        return null;

    }


    if (
        !/^[A-F0-9]{16}$/.test(
            parts[3]
        )
    ) {

        return null;

    }


    return {

        installationId:
            parts[1],

        redemptionId:
            parts[2],

        checksum:
            parts[3]

    };

}


/* =========================================================
   BASE64URL
========================================================= */

function base64UrlToBytes(
    value
) {

    let base64 =
        value
            .replace(
                /-/g,
                "+"
            )
            .replace(
                /_/g,
                "/"
            );


    while (
        base64.length % 4 !== 0
    ) {

        base64 += "=";

    }


    const binary =
        atob(
            base64
        );


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(
                i
            );

    }


    return bytes;

}


/* =========================================================
   HEX
========================================================= */

function hexToBytes(
    value
) {

    if (
        typeof value !==
        "string"
    ) {

        return null;

    }


    if (
        value.length !== 128
    ) {

        return null;

    }


    if (
        !/^[0-9a-fA-F]+$/.test(
            value
        )
    ) {

        return null;

    }


    const bytes =
        new Uint8Array(
            64
        );


    for (
        let i = 0;
        i < 64;
        i++
    ) {

        bytes[i] =
            parseInt(
                value.slice(
                    i * 2,
                    i * 2 + 2
                ),
                16
            );

    }


    return bytes;

}


/* =========================================================
   PUBLIC KEY
========================================================= */

let publicKey =
    null;

let publicKeyPromise =
    null;


async function getPublicKey() {

    if (
        publicKey
    ) {

        return publicKey;

    }


    if (
        publicKeyPromise
    ) {

        return publicKeyPromise;

    }


    publicKeyPromise =
        (
            async function() {

                if (
                    !window.crypto ||
                    !window.crypto.subtle
                ) {

                    throw new Error(
                        "Web Crypto unavailable"
                    );

                }


                const keyBytes =
                    base64UrlToBytes(
                        PUBLIC_KEY_BASE64
                    );


                publicKey =
                    await window.crypto.subtle.importKey(
                        "spki",
                        keyBytes,
                        {
                            name:
                                "Ed25519"
                        },
                        false,
                        [
                            "verify"
                        ]
                    );


                return publicKey;

            }
        )();


    return publicKeyPromise;

}


/* =========================================================
   TOKEN CODE VERIFICATION
========================================================= */

async function verifyTokenCode(
    input
) {

    let cleaned =
        input
            .trim()
            .replace(
                /\s+/g,
                ""
            );


    if (
        !cleaned.startsWith(
            TOKEN_CODE_PREFIX +
            "-"
        )
    ) {

        return {

            ok:
                false,

            message:
                "Invalid token code format."

        };

    }


    const encoded =
        cleaned
            .slice(3)
            .replace(
                /-/g,
                ""
            );


    let decodedBytes;


    try {

        decodedBytes =
            base64UrlToBytes(
                encoded
            );

    } catch (error) {

        return {

            ok:
                false,

            message:
                "Token code is corrupted."

        };

    }


    let decoded;


    try {

        decoded =
            new TextDecoder(
                "utf-8",
                {
                    fatal:
                        true
                }
            )
                .decode(
                    decodedBytes
                );

    } catch (error) {

        return {

            ok:
                false,

            message:
                "Token code could not be decoded."

        };

    }


    const parts =
        decoded.split("|");


    if (
        parts.length !== 8
    ) {

        return {

            ok:
                false,

            message:
                "Invalid token code."

        };

    }


    const gameName =
        parts[0];

    const codeInstallationId =
        parts[1];

    const redemptionId =
        parts[2];

    const rewardText =
        parts[3];

    const createdAtText =
        parts[4];

    const expiryText =
        parts[5];

    const equationText =
        parts[6];

    const signatureHex =
        parts[7];


    if (
        gameName !==
        "NEXUS"
    ) {

        return {

            ok:
                false,

            message:
                "Token code is for another game."

        };

    }


    if (
        codeInstallationId !==
        installationId
    ) {

        return {

            ok:
                false,

            message:
                "Token code belongs to another installation."

        };

    }


    if (
        !isValidCodeString(
            codeInstallationId,
            INSTALLATION_ID_LENGTH
        )
    ) {

        return {

            ok:
                false,

            message:
                "Invalid installation ID."

        };

    }


    if (
        !isValidCodeString(
            redemptionId,
            REDEMPTION_ID_LENGTH
        )
    ) {

        return {

            ok:
                false,

            message:
                "Invalid redemption ID."

        };

    }


    const reward =
        Number(
            rewardText
        );


    if (
        !Number.isSafeInteger(
            reward
        ) ||
        reward !==
        REWARD_AMOUNT
    ) {

        return {

            ok:
                false,

            message:
                "Invalid token reward."

        };

    }


    const createdAt =
        Number(
            createdAtText
        );


    const expiry =
        Number(
            expiryText
        );


    if (
        !Number.isSafeInteger(
            createdAt
        ) ||
        !Number.isSafeInteger(
            expiry
        )
    ) {

        return {

            ok:
                false,

            message:
                "Invalid token timing."

        };

    }


    if (
        expiry <=
        createdAt
    ) {

        return {

            ok:
                false,

            message:
                "Invalid token expiry."

        };

    }


    if (
        expiry -
        createdAt !==
        TOKEN_LIFETIME
    ) {

        return {

            ok:
                false,

            message:
                "Invalid token lifetime."

        };

    }


    if (
        Date.now() >=
        expiry
    ) {

        return {

            ok:
                false,

            message:
                "Token code has expired."

        };

    }


    const equation =
        calculateEquation(
            codeInstallationId +
            redemptionId
        );


    if (
        equation === null ||
        String(equation) !==
        equationText
    ) {

        return {

            ok:
                false,

            message:
                "Token equation is invalid."

        };

    }


    if (
        signatureHex.length !==
        128
    ) {

        return {

            ok:
                false,

            message:
                "Invalid token signature."

        };

    }


    const signature =
        hexToBytes(
            signatureHex
        );


    if (
        !signature
    ) {

        return {

            ok:
                false,

            message:
                "Invalid token signature."

        };

    }


    if (
        save.redeemedCodes.includes(
            redemptionId
        )
    ) {

        return {

            ok:
                false,

            message:
                "This token code has already been used."

        };

    }


    let key;


    try {

        key =
            await getPublicKey();

    } catch (error) {

        return {

            ok:
                false,

            message:
                "Offline verification is unavailable in this browser."

        };

    }


    const payload =
        parts
            .slice(
                0,
                7
            )
            .join("|");


    let valid =
        false;


    try {

        valid =
            await window.crypto.subtle.verify(
                {
                    name:
                        "Ed25519"
                },
                key,
                signature,
                new TextEncoder().encode(
                    payload
                )
            );

    } catch (error) {

        return {

            ok:
                false,

            message:
                "Token signature could not be verified."

        };

    }


    if (
        !valid
    ) {

        return {

            ok:
                false,

            message:
                "Token code verification failed."

        };

    }


    return {

        ok:
            true,

        reward:
            reward,

        redemptionId:
            redemptionId

    };

}


/* =========================================================
   REDEEM TOKEN
========================================================= */

async function redeemTokenCode() {

    const value =
        tokenInput.value;


    if (
        value.trim().length === 0
    ) {

        setMessage(
            "Enter a token code first.",
            "error"
        );


        tokenInput.focus();


        return;

    }


    setMessage(
        "Verifying token code...",
        "normal"
    );


    const result =
        await verifyTokenCode(
            value
        );


    if (
        !result.ok
    ) {

        setMessage(
            result.message,
            "error"
        );


        tokenInput.focus();


        return;

    }


    save.tokens +=
        result.reward;


    save.redeemedCodes.push(
        result.redemptionId
    );


    save.redeemedCodes =
        save.redeemedCodes.slice(
            -100
        );


    saveGame();


    tokenInput.value =
        "";


    setMessage(
        "+" +
        result.reward +
        " tokens added.",
        "success"
    );

}


/* =========================================================
   COPY
========================================================= */

async function copyRedemptionCode() {

    if (
        !currentCodeA
    ) {

        setMessage(
            "There is no redemption code yet.",
            "error"
        );


        return;

    }


    try {

        if (
            navigator.clipboard &&
            navigator.clipboard.writeText
        ) {

            await navigator.clipboard.writeText(
                currentCodeA
            );


            setMessage(
                "Redemption code copied.",
                "success"
            );


            return;

        }

    } catch (error) {

    }


    try {

        const helper =
            document.createElement(
                "textarea"
            );


        helper.value =
            currentCodeA;


        helper.style.position =
            "fixed";


        helper.style.left =
            "-9999px";


        document.body.appendChild(
            helper
        );


        helper.focus();

        helper.select();


        document.execCommand(
            "copy"
        );


        helper.remove();


        setMessage(
            "Redemption code copied.",
            "success"
        );

    } catch (error) {

        setMessage(
            "Copy failed. Copy the code manually.",
            "error"
        );

    }

}


copyButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();

        copyRedemptionCode();

    }
);

   INPUT

tokenInput.addEventListener(
    "input",
    function() {

        /*
           Token codes contain hexadecimal/base64url
           characters and hyphens.
           Keep their case exactly as entered.
        */

            tokenInput.value
                .replace(
                    /\s+/g,
                    ""
                );

    }
);


tokenInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            redeemTokenCode();

        }


        if (
            event.key ===
            "Escape"
        ) {

            event.preventDefault();

            tokenInput.blur();


            state =
                STATES.TOKENS;


            hideRedeemControls();

        }

    }
);


/* =========================================================
   CTRL+C / CTRL+V
========================================================= */

document.addEventListener(
    "keydown",
    async function(event) {

        if (
            state !==
            STATES.REDEEM
        ) {

            return;

        }


        if (
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            (
                event.key === "c" ||
                event.key === "C"
            )
        ) {

            if (
                document.activeElement !==
                tokenInput
            ) {

                event.preventDefault();

                await copyRedemptionCode();

            }


            return;

        }


        if (
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            (
                event.key === "v" ||
                event.key === "V"
            )
        ) {

            if (
                document.activeElement !==
                tokenInput
            ) {

                try {

                    const clipboard =
                        await navigator.clipboard.readText();


                    tokenInput.value =
                        clipboard;


                    tokenInput.dispatchEvent(
                        new Event(
                            "input"
                        )
                    );


                    tokenInput.focus();


                    event.preventDefault();

                } catch (error) {

                    tokenInput.focus();

                }

            }

        }

    }
);

/* =========================================================
   REDEMPTION RETRIES
========================================================= */

async function requestNewCode() {

    if (
        cooldownActive
    ) {

        state =
            STATES.COOLDOWN;

        return;

    }


    if (
        retryCount >=
        MAX_RETRIES
    ) {

        beginCooldown();

        return;

    }


    retryCount++;


    await createCodeA();


    setMessage(
        "New redemption code generated. Attempt " +
        retryCount +
        " of " +
        MAX_RETRIES +
        ".",
        "normal"
    );

}


function beginCooldown() {

    cooldownActive =
        true;


    cooldownRemaining =
        300;


    cooldownLastUpdate =
        performance.now();


    state =
        STATES.COOLDOWN;

}


function updateCooldown(
    now
) {

    if (
        !cooldownActive
    ) {

        return;

    }


    const elapsed =
        (
            now -
            cooldownLastUpdate
        ) /
        1000;


    cooldownLastUpdate =
        now;


    cooldownRemaining -=
        elapsed;


    if (
        cooldownRemaining <=
        0
    ) {

        cooldownRemaining =
            0;


        cooldownActive =
            false;


        retryCount =
            0;


        setMessage(
            "Cooldown complete. You have 3 new attempts.",
            "success"
        );


        createCodeA();

    }

}

/* =========================================================
   DIFFICULTY / COST
========================================================= */

function getDifficulty() {

    return difficulties[
        save.difficulty
    ];

}


function getRoundCost(
    difficultyIndex,
    roundIndex
) {

    const multiplier =
        difficultyIndex === 0
            ? 1
            : difficultyIndex === 1
                ? 2
                : 5;


    return (
        slowRoundCosts[
            roundIndex
        ] *
        multiplier
    );

}


function getRoundWinning(
    difficultyIndex,
    roundIndex
) {

    return (
        getRoundCost(
            difficultyIndex,
            roundIndex
        ) *
        2
    );

}


/* =========================================================
   START ROUND
========================================================= */

function startRound(
    roundNumber
) {

    const roundIndex =
        roundNumber -
        1;


    const cost =
        getRoundCost(
            save.difficulty,
            roundIndex
        );


    if (
        save.tokens <
        cost
    ) {

        setMessage(
            "You need " +
            cost +
            " tokens.",
            "error"
        );


        state =
            STATES.TOKENS;


        return;

    }


    save.tokens -=
        cost;


    saveGame();


    playerScore =
        0;

    aiScore =
        0;


    playerY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;


    aiY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;


    paused =
        false;


    matchResult =
        "";


    resetBall(
        Math.random() <
            0.5
            ? -1
            : 1
    );


    state =
        STATES.PLAYING;

}


/* =========================================================
   PONG
========================================================= */

const PADDLE_WIDTH =
    18;

const PADDLE_HEIGHT =
    110;

const PLAYER_X =
    40;

const AI_X =
    WIDTH -
    58;

const BALL_SIZE =
    16;


let playerY =
    HEIGHT / 2 -
    PADDLE_HEIGHT / 2;

let aiY =
    HEIGHT / 2 -
    PADDLE_HEIGHT / 2;

let ballX =
    WIDTH / 2;

let ballY =
    HEIGHT / 2;

let ballVX =
    0;

let ballVY =
    0;

let ballSpeed =
    0;

let playerScore =
    0;

let aiScore =
    0;

let matchResult =
    "";


const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.key
        ] =
            true;

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key
        ] =
            false;

    }
);


function resetBall(
    direction
) {

    const difficulty =
        getDifficulty();


    const roundMultiplier =
        1 +
        (
            save.currentRound -
            1
        ) *
        0.08;


    ballX =
        WIDTH / 2;


    ballY =
        HEIGHT / 2;


    ballSpeed =
        Math.min(
            difficulty.ballStartSpeed *
            roundMultiplier,
            difficulty.ballMaxSpeed
        );


    const angle =
        Math.random() *
        0.75 -
        0.375;


    ballVX =
        ballSpeed *
        direction;


    ballVY =
        ballSpeed *
        angle;

}


function updatePlayer(
    dt
) {

    let movement =
        0;


    if (
        keys["w"] ||
        keys["W"] ||
        keys["ArrowUp"]
    ) {

        movement -=
            1;

    }


    if (
        keys["s"] ||
        keys["S"] ||
        keys["ArrowDown"]
    ) {

        movement +=
            1;

    }


    playerY +=
        movement *
        540 *
        dt;


    playerY =
        Math.max(
            0,
            Math.min(
                HEIGHT -
                PADDLE_HEIGHT,
                playerY
            )
        );

}


function updateAI(
    dt
) {

    const difficulty =
        getDifficulty();


    const target =
        ballY -
        PADDLE_HEIGHT / 2;


    const roundMultiplier =
        1 +
        (
            save.currentRound -
            1
        ) *
        0.035;


    const speed =
        difficulty.aiSpeed *
        roundMultiplier;


    if (
        aiY < target
    ) {

        aiY +=
            speed *
            dt;

    }


    if (
        aiY > target
    ) {

        aiY -=
            speed *
            dt;

    }


    aiY =
        Math.max(
            0,
            Math.min(
                HEIGHT -
                PADDLE_HEIGHT,
                aiY
            )
        );

}


function updateBall(
    dt
) {

    ballX +=
        ballVX *
        dt;


    ballY +=
        ballVY *
        dt;


    if (
        ballY -
        BALL_SIZE / 2 <=
        0
    ) {

        ballY =
            BALL_SIZE / 2;


        ballVY =
            Math.abs(
                ballVY
            );

    }


    if (
        ballY +
        BALL_SIZE / 2 >=
        HEIGHT
    ) {

        ballY =
            HEIGHT -
            BALL_SIZE / 2;


        ballVY =
            -Math.abs(
                ballVY
            );

    }


    if (
        ballVX < 0 &&
        ballX -
        BALL_SIZE / 2 <=
        PLAYER_X +
        PADDLE_WIDTH &&
        ballX +
        BALL_SIZE / 2 >=
        PLAYER_X &&
        ballY >=
        playerY &&
        ballY <=
        playerY +
        PADDLE_HEIGHT
    ) {

        ballX =
            PLAYER_X +
            PADDLE_WIDTH +
            BALL_SIZE / 2;


        bounceFromPaddle(
            playerY,
            true
        );

    }


    if (
        ballVX > 0 &&
        ballX +
        BALL_SIZE / 2 >=
        AI_X &&
        ballX -
        BALL_SIZE / 2 <=
        AI_X +
        PADDLE_WIDTH &&
        ballY >=
        aiY &&
        ballY <=
        aiY +
        PADDLE_HEIGHT
    ) {

        ballX =
            AI_X -
            BALL_SIZE / 2;


        bounceFromPaddle(
            aiY,
            false
        );

    }


    if (
        ballX <
        -40
    ) {

        aiScore++;

        checkScore();

    }


    if (
        ballX >
        WIDTH +
        40
    ) {

        playerScore++;

        checkScore();

    }

}


function bounceFromPaddle(
    paddleY,
    playerSide
) {

    const difficulty =
        getDifficulty();


    const relative =
        (
            ballY -
            (
                paddleY +
                PADDLE_HEIGHT / 2
            )
        ) /
        (
            PADDLE_HEIGHT / 2
        );


    ballSpeed =
        Math.min(
            ballSpeed * 1.045,
            difficulty.ballMaxSpeed
        );


    ballVY =
        relative *
        ballSpeed *
        0.82;


    const horizontal =
        Math.sqrt(
            Math.max(
                0,
                ballSpeed *
                ballSpeed -
                ballVY *
                ballVY
            )
        );


    ballVX =
        playerSide
            ? horizontal
            : -horizontal;

}


function checkScore() {

    const target =
        roundTargets[
            save.currentRound - 1
        ];


    if (
        playerScore >=
        target
    ) {

        finishRound(
            true
        );


        return;

    }


    if (
        aiScore >=
        target
    ) {

        finishRound(
            false
        );


        return;

    }


    resetBall(
        playerScore >
        aiScore
            ? -1
            : 1
    );

}


function finishRound(
    playerWon
) {

    matchResult =
        playerWon
            ? "WIN"
            : "LOSS";


    if (
        playerWon
    ) {

        save.tokens +=
            getRoundWinning(
                save.difficulty,
                save.currentRound - 1
            );

    }


    if (
        playerWon &&
        save.currentRound ===
        5
    ) {

        if (
            save.unlockedDifficulty <
            2
        ) {

            save.unlockedDifficulty++;

        }

    }


    saveGame();


    resultSelection =
        0;


    state =
        STATES.RESULT;

}


/* =========================================================
   RESULT
========================================================= */

function chooseResult() {

    if (
        resultSelection ===
        0
    ) {

        if (
            matchResult ===
            "WIN" &&
            save.currentRound <
            5
        ) {

            save.currentRound++;

            saveGame();

        }


        const cost =
            getRoundCost(
                save.difficulty,
                save.currentRound - 1
            );


        if (
            save.tokens <
            cost
        ) {

            state =
                STATES.TOKENS;


            return;

        }


        startRound(
            save.currentRound
        );


        return;

    }


    state =
        STATES.MENU;

}

function clearScreen(

    );

function drawText(
    value,
    x,
    y,
    size,
    colour,
    align = "center"
) {

    ctx.fillStyle =
        colour;


    ctx.font =
        "bold " +
        size +
        "px Arial";


    ctx.textAlign =
        align;


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        value,
        x,
        y
    );

}


function drawPanel(
    x,
    y,
    width,
    height,
    fill,
    border
) {

    ctx.fillStyle =
        fill;


    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.strokeStyle =
        border;


    ctx.lineWidth =
        2;


    ctx.strokeRect(
        x,
        y,
        width,
        height
    );

}


function drawButton(
    label,

    y,

    height,

        state === STATES.DIFFICULTY
    ) {

        drawDifficulty();

        return;

    if (
        state === STATES.ROUND
    ) {

        drawRound();

        return;

    }


    if (
        state === STATES.PLAYING ||
        state === STATES.PAUSED
    ) {

        drawGame();

        return;

    }


    if (
        state === STATES.RESULT
    ) {

        drawResult();

        return;

    }


    if (
        state === STATES.TOKENS
    ) {

        drawTokens();

        return;

    }


    if (
        state === STATES.REDEEM
    ) {

        showRedeemControls();

        drawRedeem();

        return;

    }


    if (
        state === STATES.COOLDOWN
    ) {

        hideRedeemControls();

        drawCooldown();

    }

}


/* =========================================================
   POINTER
========================================================= */

function getPointerPosition(
    event
) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (
                event.clientX -
                rect.left
            ) *
            WIDTH /
            rect.width,

        y:
            (
                event.clientY -
                rect.top
            ) *
            HEIGHT /
            rect.height

    };

}


function hit(
    x,
    y,
    width,
    height,
    mouseX,
    mouseY
) {

    return (

        mouseX >= x &&
        mouseX <=
            x + width &&
        mouseY >= y &&
        mouseY <=
            y + height

    );

}


canvas.addEventListener(
    "pointerdown",
    function(event) {

        const point =
            getPointerPosition(
                event
            );


        handleCanvasClick(
            point.x,
            point.y
        );

    }
);


/* =========================================================
   CANVAS CLICK HANDLER
========================================================= */

function handleCanvasClick(
    x,
    y
) {

    if (
        state === STATES.MENU
    ) {

        if (
            hit(
                WIDTH / 2 - 220,
                255,
                440,
                65,
                x,
                y
            )
        ) {

            menuSelection =
                0;


            activateSelection();


            return;

        }


        if (
            hit(
                WIDTH / 2 - 220,
                330,
                440,
                65,
                x,
                y
            )
        ) {

            menuSelection =
                1;


            activateSelection();


            return;

        }

    }


    if (
        state === STATES.DIFFICULTY
    ) {

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            const top =
                148 +
                i *
                80;


            if (
                hit(
                    WIDTH / 2 - 230,
                    top,
                    460,
                    64,
                    x,
                    y
                )
            ) {

                if (
                    i <=
                    save.unlockedDifficulty
                ) {

                    difficultySelection =
                        i;


                    activateSelection();

                }

                return;

            }

        }

    }


    if (
        state === STATES.ROUND
    ) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            const top =
                181 +
                i *
                62;


            if (
                hit(
                    WIDTH / 2 - 235,
                    top,
                    470,
                    48,
                    x,
                    y
                )
            ) {

                roundSelection =
                    i;


                activateSelection();


                return;

            }

        }

    }


    if (
        state === STATES.RESULT
    ) {

        if (
            hit(
                WIDTH / 2 - 220,
                338,
                440,
                54,
                x,
                y
            )
        ) {

            resultSelection =
                0;


            activateSelection();


            return;

        }


        if (
            hit(
                WIDTH / 2 - 220,
                408,
                440,
                54,
                x,
                y
            )
        ) {

            resultSelection =
                1;


            activateSelection();


            return;

        }

    }


    if (
        state === STATES.TOKENS
    ) {

        if (
            hit(
                WIDTH / 2 - 220,
                265,
                440,
                65,
                x,
                y
            )
        ) {

            tokenSelection =
                0;


            activateSelection();


            return;

        }


        if (
            hit(
                WIDTH / 2 - 220,
                340,
                440,
                65,
                x,
                y
            )
        ) {

            tokenSelection =
                1;


            activateSelection();


            return;

        }

    }


    if (
        state === STATES.REDEEM
    ) {

        /*
           Click the Token Code box.
        */

        if (
            hit(
                45,
                280,
                870,
                100,
                x,
                y
            )
        ) {

            tokenInput.focus();

            return;

        }


        if (
            hit(
                45,
                405,
                280,
                50,
                x,
                y
            )
        ) {

            redeemSelection =
                0;


            copyRedemptionCode();


            return;

        }


        if (
            hit(
                340,
                405,
                280,
                50,
                x,
                y
            )
        ) {

            redeemSelection =
                1;


            requestNewCode();


            return;

        }


        if (
            hit(
                635,
                405,
                280,
                50,
                x,
                y
            )
        ) {

            redeemSelection =
                2;


            redeemTokenCode();


            return;

        }


        if (
            hit(
                WIDTH / 2 - 170,
                500,
                340,
                48,
                x,
                y
            )
        ) {

            redeemSelection =
                3;


            state =
                STATES.TOKENS;


            hideRedeemControls();


            return;

        }

    }


    if (
        state === STATES.PAUSED
    ) {

        if (
            hit(
                WIDTH / 2 - 140,
                255,
                280,
                90,
                x,
                y
            )
        ) {

            paused =
                false;


            state =
                STATES.PLAYING;

        }

    }


    if (
        state === STATES.COOLDOWN
    ) {

        if (
            hit(
                WIDTH / 2 - 170,
                450,
                340,
                50,
                x,
                y
            )
        ) {

            state =
                STATES.TOKENS;

        }

    }

}


/* =========================================================
   KEYBOARD NAVIGATION
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
           Don't navigate menus while typing.
        */

        if (
            document.activeElement ===
            tokenInput
        ) {

            return;

        }


        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            activateSelection();


            return;

        }


        const key =
            event.key;


        if (
            state === STATES.MENU
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                menuMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                menuMove(1);

            }


            return;

        }


        if (
            state === STATES.DIFFICULTY
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                difficultyMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                difficultyMove(1);

            }


            return;

        }


        if (
            state === STATES.ROUND
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                roundMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                roundMove(1);

            }


            return;

        }


        if (
            state === STATES.RESULT
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                resultMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                resultMove(1);

            }


            return;

        }


        if (
            state === STATES.TOKENS
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                tokenMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                tokenMove(1);

            }


            return;

        }


        if (
            state === STATES.REDEEM
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                redeemMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                redeemMove(1);

            }

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !==
            "Escape"
        ) {

            return;

        }


        if (
            state ===
            STATES.PLAYING
        ) {

            paused =
                true;


            state =
                STATES.PAUSED;


            return;

        }


        if (
            state ===
            STATES.PAUSED
        ) {

            paused =
                false;


            state =
                STATES.PLAYING;


            return;

        }


        if (
            state === STATES.DIFFICULTY ||
            state === STATES.TOKENS
        ) {

            state =
                STATES.MENU;


            return;

        }


        if (
            state === STATES.ROUND
        ) {

            state =
                STATES.DIFFICULTY;


            return;

        }


        if (
            state === STATES.RESULT
        ) {

            state =
                STATES.ROUND;


            return;

        }


        if (
            state === STATES.REDEEM
        ) {

            state =
                STATES.TOKENS;


            hideRedeemControls();


            return;

        }


        if (
            state === STATES.COOLDOWN
        ) {

            state =
                STATES.TOKENS;

        }

    }
);


/* =========================================================
   SPACE
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !==
            " " &&
            event.code !==
            "Space"
        ) {

            return;

        }


        if (
            document.activeElement ===
            tokenInput
        ) {

            return;

        }


        if (
            state ===
            STATES.PLAYING
        ) {

            event.preventDefault();


            paused =
                true;


            state =
                STATES.PAUSED;


        } else if (
            state ===
            STATES.PAUSED
        ) {

            event.preventDefault();


            paused =
                false;


            state =
                STATES.PLAYING;

        }

    }
);


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(
    dt
) {

    if (
        state ===
        STATES.PLAYING
    ) {

        updatePlayer(
            dt
        );


        updateAI(
            dt
        );


        updateBall(
            dt
        );

    }

}


/* =========================================================
   MAIN LOOP
========================================================= */

let previousTime =
    performance.now();


function loop(
    now
) {

    let dt =
        (
            now -
            previousTime
        ) /
        1000;


    previousTime =
        now;


    if (
        dt > 0.033
    ) {

        dt =
            0.033;

    }


    update(
        dt
    );


    updateCooldown(
        now
    );


    draw();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   INITIALISE
========================================================= */

createCodeA();

hideRedeemControls();

draw();

requestAnimationFrame(
    loop
);

</script>

</body>
