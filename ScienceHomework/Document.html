<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ping Pong</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0b0d10;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:auto}
#wrap{width:min(100vw,1000px);padding:18px;display:flex;flex-direction:column;gap:10px}
#top{display:flex;justify-content:space-between;align-items:center;min-height:24px;font-size:14px;color:#b8bec8}
#game{display:block;width:100%;height:auto;aspect-ratio:960/600;background:#11151a;border:1px solid #303640;touch-action:none}
#under{display:flex;gap:8px;flex-wrap:wrap}
button,input,textarea{font:inherit}
button{background:#1a1f26;color:#fff;border:1px solid #3a424d;border-radius:6px;padding:9px 12px;cursor:pointer}
button:hover{background:#232a33}
button:disabled{opacity:.55;cursor:not-allowed}
#codePanel{display:none;width:100%;padding:14px;background:#12161c;border:1px solid #303640;border-radius:6px}
#codePanel.open{display:block}
#codeTitle{font-size:16px;font-weight:700;line-height:1.2;margin-bottom:6px}
#codeHint{font-size:12px;color:#89919d;line-height:1.45;margin-bottom:10px}
.codeLabel{font-size:11px;font-weight:700;letter-spacing:.05em;color:#9fa7b2;margin:10px 0 5px}
.codeRow{display:flex;align-items:stretch;gap:8px;min-width:0}
#generatedCode{flex:1;min-width:0;min-height:72px;resize:vertical;padding:10px;background:#090b0e;color:#fff;border:1px solid #3a424d;border-radius:5px;font-family:Consolas,Monaco,monospace;font-size:12px;line-height:1.5;overflow:auto;word-break:break-all;white-space:pre-wrap;user-select:text}
#copyGenerated{flex:0 0 44px;width:44px;padding:0;font-size:18px;line-height:1}
#codeInput{display:block;width:100%;min-width:0;min-height:72px;resize:vertical;padding:10px;background:#090b0e;color:#fff;border:1px solid #3a424d;border-radius:5px;font-family:Consolas,Monaco,monospace;font-size:12px;line-height:1.5;overflow:auto;word-break:break-all;white-space:pre-wrap;user-select:text;text-transform:none;letter-spacing:normal}
.codeActions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.codeActions button{flex:1 1 130px}
#message{display:block;min-height:40px;margin-top:10px;padding:8px 10px;background:#0b0d10;border:1px solid #252b33;border-radius:5px;color:#b8bec8;font-size:13px;line-height:1.45;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
#message.ok{color:#fff}
#message.error{color:#fff}
@media(max-width:600px){
  body{align-items:flex-start}
  #wrap{padding:8px}
  #top{font-size:12px}
  button{padding:8px 10px}
  #generatedCode,#codeInput{font-size:11px;min-height:84px}
  #copyGenerated{flex-basis:40px;width:40px}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><span>PONG</span><span id="tokens">Tokens: 10</span></div>
  <canvas id="game" width="960" height="600"></canvas>
  <div id="under">
    <button id="getTokensBtn" type="button">Get Tokens</button>
  </div>

  <section id="codePanel" aria-label="Token codes">
    <div id="codeTitle">TOKEN CODE</div>
    <div id="codeHint">The game is completely offline. It never connects to the internet. Redemption Codes are converted on the website; Token Codes are verified locally in this game.</div>

    <div class="codeLabel">REDEMPTION CODE</div>
    <div class="codeRow">
      <textarea id="generatedCode" readonly spellcheck="false" wrap="soft" aria-label="Generated Redemption Code"></textarea>
      <button id="copyGenerated" type="button" title="Copy Redemption Code" aria-label="Copy Redemption Code">📋</button>
    </div>

    <div class="codeLabel">TOKEN CODE</div>
    <textarea id="codeInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste your B2 Token Code here" wrap="soft" aria-label="Token Code"></textarea>

    <div class="codeActions">
      <button id="submitCode" type="button">Verify Token Code</button>
      <button id="copyToken" type="button">Copy Token Code</button>
      <button id="closeCode" type="button">Close</button>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const tokensEl = document.getElementById("tokens");
  const getTokensBtn = document.getElementById("getTokensBtn");
  const codePanel = document.getElementById("codePanel");
  const codeTitle = document.getElementById("codeTitle");
  const generatedCode = document.getElementById("generatedCode");
  const copyGenerated = document.getElementById("copyGenerated");
  const codeInput = document.getElementById("codeInput");
  const submitCode = document.getElementById("submitCode");
  const copyToken = document.getElementById("copyToken");
  const closeCode = document.getElementById("closeCode");
  const message = document.getElementById("message");

  const PUBLIC_KEY_B64 = "MCowBQYDK2VwAyEATJAcgkn3awdVvfnhaWPRgzdD2BDWreSkg0kstuun37I=";
  const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const REWARD = 10;
  const STARTING_TOKENS = 10;
  const INSTALLATION_LENGTH = 48;
  const REDEMPTION_ID_LENGTH = 32;
  const DIFFICULTIES = ["Slow", "Normal", "Hard"];
  const TARGETS = [5, 10, 15, 20, 25];
  const BASE_COSTS = [1, 3, 7, 15, 31];
  const DIFFICULTY_MULTIPLIER = [1, 2, 5];

  const PADDLE_W = 16;
  const PADDLE_H = 100;
  const BALL_SIZE = 16;
  const PLAYER_X = 36;
  const AI_X = 908;

  let storageAvailable = true;
  const memoryStore = Object.create(null);

  function storageGet(key) {
    if (!storageAvailable) {
      return Object.prototype.hasOwnProperty.call(memoryStore, key)
        ? memoryStore[key]
        : null;
    }

    try {
      return window.localStorage.getItem(key);
    } catch (_) {
      storageAvailable = false;
      return Object.prototype.hasOwnProperty.call(memoryStore, key)
        ? memoryStore[key]
        : null;
    }
  }

  function storageSet(key, value) {
    const stringValue = String(value);
    memoryStore[key] = stringValue;

    if (!storageAvailable) return;

    try {
      window.localStorage.setItem(key, stringValue);
    } catch (_) {
      storageAvailable = false;
    }
  }

  function safeJsonParse(value, fallback) {
    try {
      const parsed = JSON.parse(value);
      return parsed == null ? fallback : parsed;
    } catch (_) {
      return fallback;
    }
  }

  function randomString(length) {
    let out = "";

    try {
      if (
        window.crypto &&
        typeof window.crypto.getRandomValues === "function"
      ) {
        const values = new Uint32Array(length);
        window.crypto.getRandomValues(values);

        for (let i = 0; i < length; i++) {
          out += ALPHABET[values[i] % ALPHABET.length];
        }

        return out;
      }
    } catch (_) {}

    for (let i = 0; i < length; i++) {
      out += ALPHABET[
        Math.floor(Math.random() * ALPHABET.length)
      ];
    }

    return out;
  }

  let installationId = storageGet("pong_installation_id");

  if (!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{48}$/.test(installationId || "")) {
    installationId = randomString(INSTALLATION_LENGTH);
    storageSet("pong_installation_id", installationId);
  }

  let tokens = Number(storageGet("pong_tokens"));

  if (!Number.isFinite(tokens) || tokens < 0) {
    tokens = STARTING_TOKENS;
  }

  let usedCodes = safeJsonParse(
    storageGet("pong_used_codes") || "[]",
    []
  );

  if (!Array.isArray(usedCodes)) {
    usedCodes = [];
  }

  function saveTokens() {
    tokens = Math.max(
      0,
      Math.floor(tokens)
    );

    storageSet(
      "pong_tokens",
      tokens
    );

    tokensEl.textContent =
      "Tokens: " + tokens;

    getTokensBtn.disabled =
      tokens >= 10;

    getTokensBtn.title =
      tokens >= 10
        ? "Spend tokens before requesting more."
        : "Get 10 more tokens.";

    getTokensBtn.setAttribute(
      "aria-label",
      getTokensBtn.title
    );
  }

  saveTokens();

  let screen = "menu";
  let menuIndex = 0;
  let difficulty = 0;
  let round = 1;
  let playerScore = 0;
  let aiScore = 0;
  let paused = false;
  let lastTime = performance.now();
  let winner = "";
  let ball = {
    x: 480,
    y: 300,
    vx: 0,
    vy: 0
  };

  let playerY = 250;
  let aiY = 250;
  let keys = Object.create(null);
  let touchDirection = 0;
  let currentRedemptionCode = "";

  function characterValue(character) {
    const index =
      ALPHABET.indexOf(character);

    return index < 0
      ? -1
      : index + 11;
  }

  function calculateEquation(text) {
    const values = [];

    for (const character of text) {
      const value =
        characterValue(character);

      if (value < 0) {
        return null;
      }

      values.push(value);
    }

    if (values.length < 16) {
      return null;
    }

    let a = values[0] * values[2];
    let b = values[1] + values[3];
    let c = values[4] * 7;
    let d = values[5] + values[6];
    let e = (a + b) * c;
    let f = e + d;
    let g = f * values[7];
    let h = g + values[8];
    let i = h * values[9];
    let j = i + values[10];

    let k =
      (j * values[11]) +
      (j ^ values[11]);

    k =
      Math.abs(
        k % 1000000007
      );

    let l = k + values[12];
    let m = l * values[13];
    let n = m + values[14];

    let result =
      n * values[15];

    result =
      Math.abs(
        result % 1000000007
      );

    return result;
  }

  function isCodeStringValid(
    value,
    expectedLength
  ) {
    if (
      typeof value !== "string" ||
      value.length !== expectedLength
    ) {
      return false;
    }

    for (const character of value) {
      if (!ALPHABET.includes(character)) {
        return false;
      }
    }

    return true;
  }

  const SHA256_K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,
    0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,
    0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,
    0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,
    0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,
    0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,
    0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,
    0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,
    0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

  function rotr(x, n) {
    return (
      (x >>> n) |
      (x << (32 - n))
    );
  }

  function sha256(text) {
    const bytes =
      new TextEncoder().encode(text);

    const bitLength =
      bytes.length * 8;

    const paddedLength =
      Math.ceil(
        (bytes.length + 9) / 64
      ) * 64;

    const data =
      new Uint8Array(paddedLength);

    data.set(bytes);

    data[bytes.length] =
      0x80;

    const high =
      Math.floor(
        bitLength / 0x100000000
      );

    const low =
      bitLength >>> 0;

    data[paddedLength - 8] =
      (high >>> 24) & 255;

    data[paddedLength - 7] =
      (high >>> 16) & 255;

    data[paddedLength - 6] =
      (high >>> 8) & 255;

    data[paddedLength - 5] =
      high & 255;

    data[paddedLength - 4] =
      (low >>> 24) & 255;

    data[paddedLength - 3] =
      (low >>> 16) & 255;

    data[paddedLength - 2] =
      (low >>> 8) & 255;

    data[paddedLength - 1] =
      low & 255;

    let h0 = 0x6a09e667;
    let h1 = 0xbb67ae85;
    let h2 = 0x3c6ef372;
    let h3 = 0xa54ff53a;
    let h4 = 0x510e527f;
    let h5 = 0x9b05688c;
    let h6 = 0x1f83d9ab;
    let h7 = 0x5be0cd19;

    const w =
      new Uint32Array(64);

    for (
      let offset = 0;
      offset < data.length;
      offset += 64
    ) {
      for (
        let i = 0;
        i < 16;
        i++
      ) {
        const p =
          offset + i * 4;

        w[i] =
          (
            (data[p] << 24) |
            (data[p + 1] << 16) |
            (data[p + 2] << 8) |
            data[p + 3]
          ) >>> 0;
      }

      for (
        let i = 16;
        i < 64;
        i++
      ) {
        const s0 =
          rotr(
            w[i - 15],
            7
          ) ^
          rotr(
            w[i - 15],
            18
          ) ^
          (w[i - 15] >>> 3);

        const s1 =
          rotr(
            w[i - 2],
            17
          ) ^
          rotr(
            w[i - 2],
            19
          ) ^
          (w[i - 2] >>> 10);

        w[i] =
          (
            w[i - 16] +
            s0 +
            w[i - 7] +
            s1
          ) >>> 0;
      }

      let a = h0;
      let b = h1;
      let c = h2;
      let d = h3;
      let e = h4;
      let f = h5;
      let g = h6;
      let h = h7;

      for (
        let i = 0;
        i < 64;
        i++
      ) {
        const S1 =
          rotr(e, 6) ^
          rotr(e, 11) ^
          rotr(e, 25);

        const ch =
          (e & f) ^
          (~e & g);

        const temp1 =
          (
            h +
            S1 +
            ch +
            SHA256_K[i] +
            w[i]
          ) >>> 0;

        const S0 =
          rotr(a, 2) ^
          rotr(a, 13) ^
          rotr(a, 22);

        const maj =
          (a & b) ^
          (a & c) ^
          (b & c);

        const temp2 =
          (S0 + maj) >>> 0;

        h = g;
        g = f;
        f = e;
        e =
          (d + temp1) >>> 0;
        d = c;
        c = b;
        b = a;
        a =
          (temp1 + temp2) >>> 0;
      }

      h0 =
        (h0 + a) >>> 0;

      h1 =
        (h1 + b) >>> 0;

      h2 =
        (h2 + c) >>> 0;

      h3 =
        (h3 + d) >>> 0;

      h4 =
        (h4 + e) >>> 0;

      h5 =
        (h5 + f) >>> 0;

      h6 =
        (h6 + g) >>> 0;

      h7 =
        (h7 + h) >>> 0;
    }

    return [
      h0,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      h7
    ]
      .map(
        value =>
          value
            .toString(16)
            .padStart(8, "0")
      )
      .join("");
  }

  function createRequestChecksum(
    installId,
    redemptionId
  ) {
    const equation =
      calculateEquation(
        installId +
        redemptionId
      );

    if (equation === null) {
      return null;
    }

    return sha256(
      installId +
      "|" +
      redemptionId +
      "|" +
      equation
    )
      .slice(0, 16)
      .toUpperCase();
  }

  function createCodeA() {
    const redemptionId =
      randomString(
        REDEMPTION_ID_LENGTH
      );

    const checksum =
      createRequestChecksum(
        installationId,
        redemptionId
      );

    if (!checksum) {
      throw new Error(
        "Could not create code checksum."
      );
    }

    return (
      "A1-" +
      installationId +
      "-" +
      redemptionId +
      "-" +
      checksum
    );
  }

  function base64ToBytes(base64) {
    const binary =
      atob(base64);

    const bytes =
      new Uint8Array(
        binary.length
      );

    for (
      let i = 0;
      i < binary.length;
      i++
    ) {
      bytes[i] =
        binary.charCodeAt(i);
    }

    return bytes;
  }

  function hexToBytes(hex) {
    const out =
      new Uint8Array(
        hex.length / 2
      );

    for (
      let i = 0;
      i < out.length;
      i++
    ) {
      out[i] =
        parseInt(
          hex.slice(
            i * 2,
            i * 2 + 2
          ),
          16
        );
    }

    return out;
  }

  function cleanTokenCode(value) {
    let text =
      String(value || "")
        .replace(
          /[\u00A0\r\n\t ]+/g,
          ""
        )
        .replace(
          /[–—−]/g,
          "-"
        )
        .trim();

    try {
      const parsed =
        JSON.parse(text);

      if (
        parsed &&
        typeof parsed.outputCode ===
          "string"
      ) {
        text =
          parsed.outputCode.trim();
      }
    } catch (_) {}

    const codeStart =
      text.search(/B2-/i);

    if (codeStart > 0) {
      text =
        text.slice(codeStart);
    }

    if (
      text.startsWith('"') &&
      text.endsWith('"')
    ) {
      text =
        text.slice(
          1,
          -1
        );
    }

    if (text.endsWith(",")) {
      text =
        text.slice(
          0,
          -1
        );
    }

    return text.trim();
  }

  function workerGroupedPayloadToRaw(value) {
    let raw = "";
    let groupLength = 0;

    for (
      let i = 0;
      i < value.length;
      i++
    ) {
      const character =
        value[i];

      if (
        character === "-" &&
        groupLength === 10
      ) {
        groupLength = 0;
        continue;
      }

      raw += character;
      groupLength++;

      if (groupLength > 10) {
        return "";
      }
    }

    return raw;
  }

  function base64UrlToText(value) {
    let normalized =
      value
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    while (
      normalized.length % 4
    ) {
      normalized += "=";
    }

    const binary =
      atob(normalized);

    const bytes =
      new Uint8Array(
        binary.length
      );

    for (
      let i = 0;
      i < binary.length;
      i++
    ) {
      bytes[i] =
        binary.charCodeAt(i);
    }

    return new TextDecoder()
      .decode(bytes);
  }

  async function verifyCodeB(input) {
    const cleaned =
      cleanTokenCode(input);

    if (!cleaned) {
      return {
        ok: false,
        error:
          "Paste a Token Code first."
      };
    }

    const firstDash =
      cleaned.indexOf("-");

    const prefix =
      firstDash >= 0
        ? cleaned
            .slice(
              0,
              firstDash
            )
            .toUpperCase()
        : cleaned
            .slice(0, 2)
            .toUpperCase();

    if (prefix !== "B2") {
      return {
        ok: false,
        error:
          "That is not a B2 Token Code. Paste the Token Code returned by the website, not the A1 Redemption Code."
      };
    }

    const encoded =
      workerGroupedPayloadToRaw(
        firstDash >= 0
          ? cleaned.slice(
              firstDash + 1
            )
          : cleaned.slice(2)
      );

    if (!encoded) {
      return {
        ok: false,
        error:
          "The Token Code contains no data."
      };
    }

    if (
      !/^[A-Za-z0-9_-]+$/.test(
        encoded
      )
    ) {
      return {
        ok: false,
        error:
          "The Token Code contains invalid characters. Copy it again without changing any letters."
      };
    }

    let decoded;

    try {
      decoded =
        base64UrlToText(
          encoded
        );
    } catch (_) {
      return {
        ok: false,
        error:
          "The Token Code could not be decoded. Make sure you copied the entire code."
      };
    }

    const parts =
      decoded.split("|");

    if (parts.length !== 8) {
      return {
        ok: false,
        error:
          "The Token Code data is incomplete or has been changed. Copy a fresh Token Code from the website."
      };
    }

    const [
      game,
      installId,
      redemptionId,
      rewardText,
      createdText,
      expiryText,
      equationText,
      signatureHex
    ] = parts;

    if (game !== "NEXUS") {
      return {
        ok: false,
        error:
          "This Token Code is not for this game."
      };
    }

    if (
      installId !==
      installationId
    ) {
      return {
        ok: false,
        error:
          "This Token Code belongs to a different copy of the game. Generate a new Redemption Code from this copy."
      };
    }

    if (
      !isCodeStringValid(
        redemptionId,
        REDEMPTION_ID_LENGTH
      )
    ) {
      return {
        ok: false,
        error:
          "The redemption ID inside this Token Code is invalid."
      };
    }

    if (
      !/^[0-9a-fA-F]{128}$/.test(
        signatureHex
      )
    ) {
      return {
        ok: false,
        error:
          "The Token Code signature data is invalid."
      };
    }

    const reward =
      Number(rewardText);

    const created =
      Number(createdText);

    const expiry =
      Number(expiryText);

    const equation =
      Number(equationText);

    const now =
      Date.now();

    if (reward !== REWARD) {
      return {
        ok: false,
        error:
          "The Token Code reward is invalid."
      };
    }

    if (
      !Number.isSafeInteger(created) ||
      !Number.isSafeInteger(expiry) ||
      !Number.isSafeInteger(equation)
    ) {
      return {
        ok: false,
        error:
          "The Token Code contains invalid numeric data."
      };
    }

    if (now > expiry) {
      return {
        ok: false,
        error:
          "This Token Code has expired. Generate a new one on the website."
      };
    }

    if (
      created >
      now + 300000
    ) {
      return {
        ok: false,
        error:
          "This Token Code has an invalid creation time."
      };
    }

    const expectedEquation =
      calculateEquation(
        installId +
        redemptionId
      );

    if (
      expectedEquation === null ||
      expectedEquation !== equation
    ) {
      return {
        ok: false,
        error:
          "The Token Code equation does not match its installation data."
      };
    }

    if (
      usedCodes.includes(
        redemptionId
      )
    ) {
      return {
        ok: false,
        error:
          "This Token Code has already been used on this installation."
      };
    }

    if (
      !window.crypto ||
      !window.crypto.subtle ||
      typeof window.crypto.subtle.importKey !==
        "function"
    ) {
      return {
        ok: false,
        error:
          "Offline signature verification is unavailable in this browser. Open the game in a current Chromium, Firefox, or Safari browser."
      };
    }

    try {
      const publicKey =
        await window.crypto.subtle.importKey(
          "spki",
          base64ToBytes(
            PUBLIC_KEY_B64
          ),
          {
            name: "Ed25519"
          },
          false,
          ["verify"]
        );

      const valid =
        await window.crypto.subtle.verify(
          "Ed25519",
          publicKey,
          hexToBytes(
            signatureHex
          ),
          new TextEncoder().encode(
            parts
              .slice(0, 7)
              .join("|")
          )
        );

      if (!valid) {
        return {
          ok: false,
          error:
            "The Token Code signature is not valid. The code may be from a different Worker key or may have been altered."
        };
      }
    } catch (_) {
      return {
        ok: false,
        error:
          "The Token Code could not be signature-checked offline. Nothing was sent to the internet."
      };
    }

    return {
      ok: true,
      reward,
      redemptionId
    };
  }

    if (tokens >= 10) {
      setMessage(
        "You already have 10 or more tokens. Spend some tokens before getting another Token Code.",

      );
      return;
    }

    try {
      currentRedemptionCode =
        createCodeA();

      generatedCode.value =
        currentRedemptionCode;

      codeInput.value = "";

      setMessage(
        "Copy the A1 Redemption Code into the website redemption box. The website will return a B2 Token Code. Paste that B2 code into TOKEN CODE below."
      );

      openCodePanel(
        "GET TOKENS"
      );

      codeInput.focus();
    } catch (_) {
      generatedCode.value =

      setMessage(

        "error"
      );

      openCodePanel(
        "GET TOKENS"
      );

  async function copyText(
    value,
    successText
  ) {
    if (!value) {
      setMessage(
        "There is no code to copy.",
        "error"
      );
      return;
    }

    try {
      await navigator.clipboard.writeText(
        value
      );

      setMessage(
        successText,
        "ok"
      );

      return;
    } catch (_) {}

    try {
      const helper =
        document.createElement(
          "textarea"
        );

      helper.value =
        value;

      helper.setAttribute(
        "readonly",
        ""
      );

      helper.style.position =
        "fixed";

      helper.style.left =
        "-9999px";

      document.body.appendChild(
        helper
      );

      helper.select();

      document.execCommand(
        "copy"
      );

      helper.remove();

      setMessage(
        successText,
        "ok"
      );
    } catch (_) {
      setMessage(
        "Copy was unavailable. Select the code and press Ctrl+C.",
        "error"
      );
    }
  }

    "click",
    async () => {
      const value =
        cleanTokenCode(
          codeInput.value
        );

      codeInput.value =
        value;

      if (!value) {
        setMessage(
          "Paste a B2 Token Code first.",
          "error"
        );

        codeInput.focus();

        return;
      }

      submitCode.disabled =
        true;

      setMessage(
        "Verifying locally...",
        ""
      );

      const result =
        await verifyCodeB(
          value
        );

      submitCode.disabled =
        false;

      if (!result.ok) {
        setMessage(
          result.error,
          "error"
        );

        return;
      }

      tokens +=
        result.reward;

      saveTokens();

      usedCodes.push(
        result.redemptionId
      );

      if (
        usedCodes.length >
        100
      ) {
        usedCodes =
          usedCodes.slice(
            -100
          );
      }

      storageSet(
        "pong_used_codes",
        JSON.stringify(
          usedCodes
        )
      );

      codeInput.value =
        "";

      generatedCode.value =
        "";

      currentRedemptionCode =

      setMessage(

        " tokens.",
        "ok"

  function getRoundCost() {
    return (
      BASE_COSTS[
        round - 1
      ] *
      DIFFICULTY_MULTIPLIER[
        difficulty
      ]
    );
  }

  function getRoundPayout() {
    return (
      getRoundCost() *
      2
    );
  }

  function isDifficultyUnlocked(
    index
  ) {
    if (index === 0) {
      return true;
    }

    return (
      storageGet(
        "pong_unlock_" +
        index
      ) === "1"
    );
  }

  function unlockNextDifficulty() {
    if (
      difficulty <
      DIFFICULTIES.length - 1
    ) {
      storageSet(
        "pong_unlock_" +
        (difficulty + 1),
        "1"
      );
    }
  }

  function resetBall(
    direction
  ) {
    ball.x =
      canvas.width / 2;

    ball.y =
      canvas.height / 2;

    const baseSpeed =
      [350,410,470][
        difficulty
      ];

    const speed =
      baseSpeed +
      (round - 1) * 22;

    const angle =
      Math.random() *
        0.8 -
      0.4;

    ball.vx =
      direction *
      speed;

    ball.vy =
      speed *
      angle;
  }

  function startRound() {
    const cost =
      getRoundCost();

    if (tokens < cost) {
      winner =
        "Not enough tokens.";

      screen =
        "result";

      return;
    }

    tokens -=
      cost;

    saveTokens();

    playerScore = 0;
    aiScore = 0;
    paused = false;
    winner = "";

    playerY =
      (canvas.height -
        PADDLE_H) /
      2;

    aiY =
      (canvas.height -
        PADDLE_H) /
      2;

    resetBall(
      Math.random() < 0.5
        ? -1
        : 1
    );

    screen =
      "game";
  }

  function beginDifficulty(
    index
  ) {
    if (
      !isDifficultyUnlocked(
        index
      )
    ) {
      return;
    }

    difficulty =
      index;

    round =
      1;

    startRound();
  }

  function nextRound() {
    if (round < 5) {
      round++;

      startRound();

      return;
    }

    unlockNextDifficulty();

    if (
      difficulty <
      DIFFICULTIES.length - 1
    ) {
      const completedName =
        DIFFICULTIES[
          difficulty
        ];

      const next =
        difficulty + 1;

      difficulty =
        next;

      menuIndex =
        next;

      winner =
        "Completed " +
        completedName +
        ". " +
        DIFFICULTIES[
          difficulty
        ] +
        " is now unlocked.";

      screen =
        "menu";
    } else {
      winner =
        "You completed all three difficulties!";

      screen =
        "result";
    }
  }

  function endRound(
    playerWon
  ) {
    if (playerWon) {
      const payout =
        getRoundPayout();

      tokens +=
        payout;

      saveTokens();

      winner =
        "You won Round " +
        round +
        "! +" +
        payout +
        " tokens.";
    } else {
      winner =
        "You lost Round " +
        round +
        ".";
    }

    screen =
      "result";
  }

  function update(dt) {
    if (
      screen !==
        "game" ||
      paused
    ) {
      return;
    }

    const playerSpeed =
      520;

    if (
      keys.w ||
      keys.W ||
      keys.ArrowUp
    ) {
      playerY -=
        playerSpeed *
        dt;
    }

    if (
      keys.s ||
      keys.S ||
      keys.ArrowDown
    ) {
      playerY +=
        playerSpeed *
        dt;
    }

    if (touchDirection) {
      playerY +=
        touchDirection *
        playerSpeed *
        dt;
    }

    playerY =
      Math.max(
        0,
        Math.min(
          canvas.height -
            PADDLE_H,
          playerY
        )
      );

    const aiTarget =
      ball.y -
      PADDLE_H / 2;

    const aiSpeed =
      [270,380,500][
        difficulty
      ];

    const aiDifference =
      aiTarget -
      aiY;

    if (
      Math.abs(
        aiDifference
      ) > 5
    ) {
      aiY +=
        Math.sign(
          aiDifference
        ) *
        Math.min(
          Math.abs(
            aiDifference
          ),
          aiSpeed *
            dt
        );
    }

    aiY =
      Math.max(
        0,
        Math.min(
          canvas.height -
            PADDLE_H,
          aiY
        )
      );

    ball.x +=
      ball.vx *
      dt;

    ball.y +=
      ball.vy *
      dt;

    if (
      ball.y <=
      BALL_SIZE / 2
    ) {
      ball.y =
        BALL_SIZE / 2;

      ball.vy =
        Math.abs(
          ball.vy
        );
    }

    if (
      ball.y >=
      canvas.height -
        BALL_SIZE / 2
    ) {
      ball.y =
        canvas.height -
        BALL_SIZE / 2;

      ball.vy =
        -Math.abs(
          ball.vy
        );
    }

    const playerHit =
      ball.x -
        BALL_SIZE / 2 <=
        PLAYER_X +
        PADDLE_W &&
      ball.x +
        BALL_SIZE / 2 >=
        PLAYER_X &&
      ball.y >= playerY &&
      ball.y <=
        playerY +
        PADDLE_H &&
      ball.vx < 0;

    if (playerHit) {
      ball.x =
        PLAYER_X +
        PADDLE_W +
        BALL_SIZE / 2;

      const offset =
        (
          ball.y -
          (
            playerY +
            PADDLE_H / 2
          )
        ) /
        (PADDLE_H / 2);

      const speed =
        Math.min(
          Math.hypot(
            ball.vx,
            ball.vy
          ) *
            1.045,
          850
        );

      ball.vx =
        speed;

      ball.vy =
        offset *
        speed *
        0.9;
    }

    const aiHit =
      ball.x +
        BALL_SIZE / 2 >=
        AI_X &&
      ball.x -
        BALL_SIZE / 2 <=
        AI_X +
        PADDLE_W &&
      ball.y >= aiY &&
      ball.y <=
        aiY +
        PADDLE_H &&
      ball.vx > 0;

    if (aiHit) {
      ball.x =
        AI_X -
        BALL_SIZE / 2;

      const offset =
        (
          ball.y -
          (
            aiY +
            PADDLE_H / 2
          )
        ) /
        (PADDLE_H / 2);

      const speed =
        Math.min(
          Math.hypot(
            ball.vx,
            ball.vy
          ) *
            1.045,
          850
        );

      ball.vx =
        -speed;

      ball.vy =
        offset *
        speed *
        0.9;
    }

    if (
      ball.x <
      -30
    ) {
      aiScore++;

      if (
        aiScore >=
        TARGETS[
          round - 1
        ]
      ) {
        endRound(false);
      } else {
        resetBall(1);
      }
    }

    if (
      ball.x >
      canvas.width +
        30
    ) {
      playerScore++;

      if (
        playerScore >=
        TARGETS[
          round - 1
        ]
      ) {
        endRound(true);
      } else {
        resetBall(-1);
      }
    }
  }

  function text(
    value,
    x,
    y,
    size,
    align = "center"
  ) {
    ctx.fillStyle =
      "#fff";

    ctx.font =
      "bold " +
      size +
      "px Arial";

    ctx.textAlign =
      align;

    ctx.textBaseline =
      "alphabetic";

    ctx.fillText(
      String(value),

      y
    );
  }

  function wrapLines(
    value,
    size,
    maxWidth
  ) {
    ctx.font =
      "bold " +
      size +
      "px Arial";

    const words =
      String(value)
        .split(/\s+/);

    const lines = [];
    let line = "";

    for (
      const word of words
    ) {
      const test =
        line
          ? line +
            " " +
            word
          : word;

      if (
        ctx.measureText(
          test
        ).width <=
          maxWidth ||
        !line
      ) {
        line =
          test;
      } else {
        lines.push(
          line
        );

        line =
          word;
      }
    }

    if (line) {
      lines.push(
        line
      );
    }

    return lines;
  }

  function wrappedText(
    value,
    x,
    topY,
    size,
    maxWidth,
    lineHeight
  ) {
    ctx.fillStyle =
      "#fff";

    ctx.font =
      "bold " +
      size +
      "px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "top";

    const lines =
      wrapLines(
        value,
        size,
        maxWidth
      );

    lines.forEach(
      (
        line,
        index
      ) =>
        ctx.fillText(
          line,
          x,
          topY +
            index *
              lineHeight
        )
    );

    return {
      lines,
      height:
        lines.length *
        lineHeight
    };
  }

  function wrappedTextLimited(
    value,
    x,
    topY,
    size,
    maxWidth,
    lineHeight,
    maxLines
  ) {
    ctx.fillStyle =
      "#fff";

    ctx.font =
      "bold " +
      size +
      "px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "top";

    let lines =
      wrapLines(
        value,
        size,
        maxWidth
      );

    if (
      lines.length >
      maxLines
    ) {
      lines =
        lines.slice(
          0,
          maxLines
        );

      let last =
        lines[
          maxLines - 1
        ];

      while (
        ctx.measureText(
          last + "…"
        ).width >
          maxWidth &&
        last.length > 1
      ) {
        last =
          last.slice(
            0,
            -1
          );
      }

      lines[
        maxLines - 1
      ] =
        last + "…";
    }

    lines.forEach(
      (
        line,
        index
      ) =>
        ctx.fillText(
          line,
          x,
          topY +
            index *
              lineHeight
        )
    );

    return {
      lines,
      height:
        lines.length *
        lineHeight
    };
  }

    clearCanvas();

    ctx.lineWidth =
      2;

    ctx.setLineDash(
      [8,12]
    );

    ctx.beginPath();

    ctx.moveTo(
      canvas.width / 2,
      0
    );

    ctx.lineTo(
      canvas.width / 2,
      canvas.height
    );

    ctx.stroke();

    ctx.setLineDash(
      []
    );

    ctx.fillStyle =
      "#fff";

    ctx.fillRect(
      PLAYER_X,
      playerY,
      PADDLE_W,
      PADDLE_H
    );

    ctx.fillRect(
      AI_X,
      aiY,
      PADDLE_W,
      PADDLE_H
    );

    ctx.fillRect(
      ball.x -
        BALL_SIZE / 2,
      ball.y -
        BALL_SIZE / 2,
      BALL_SIZE,
      BALL_SIZE
    );

    text(
      String(
        playerScore
      ),
      420,
      70,
      48
    );

    text(
      String(
        aiScore
      ),
      540,
      70,
      48
    );

      "ROUND " +
        round +
        "/5",

      35,
      18
    );

      playerScore +

      16
    );

      54
    );

    );

          };

    ) {

  window.addEventListener(
    "keydown",
    event => {
      if (
        [
          "ArrowUp",
          "ArrowDown",
          "Space"
        ].includes(
          event.code
        )
      ) {
        event.preventDefault();
      }

      if (
        document.activeElement ===
          codeInput ||
        document.activeElement ===
          generatedCode
      ) {
        return;
      }

      keys[event.key] =
        true;

      keys[event.code] =
        true;

      if (
        screen ===
        "menu"
      ) {
        if (
          event.key ===
            "ArrowUp" ||
          event.key.toLowerCase() ===
            "w"
        ) {
          menuIndex =
            (
              menuIndex +
              DIFFICULTIES.length -
              1
            ) %
            DIFFICULTIES.length;
        }

        if (
          event.key ===
            "ArrowDown" ||
          event.key.toLowerCase() ===
            "s"
        ) {
          menuIndex =
            (
              menuIndex +
              1
            ) %
            DIFFICULTIES.length;
        }

        if (
          event.key ===
          "Enter"
        ) {
          beginDifficulty(
            menuIndex
          );
        }
      } else if (
        screen ===
        "game"
      ) {
        if (
          event.code ===
          "Space"
        ) {
          paused =
            !paused;
        }

        if (
          event.key ===
          "Escape"
        ) {
          screen =
            "menu";

          paused =
            false;
        }
      } else if (
        screen ===
        "result"
      ) {
        if (
          event.key ===
          "Enter"
        ) {
          if (
            winner.startsWith(
              "You won Round"
            )
          ) {
            nextRound();
          } else if (
            winner.includes(
              "unlocked"
            )
          ) {
            beginDifficulty(
              difficulty
            );
          } else {
            screen =
              "menu";
          }
        }

        if (
          event.key ===
          "Escape"
        ) {
          screen =
            "menu";
        }
      }
    }
  );

  window.addEventListener(
    "keyup",
    event => {
      if (
        document.activeElement ===
          codeInput ||
        document.activeElement ===
          generatedCode
      ) {
        return;
      }

      keys[event.key] =
        false;

      keys[event.code] =
        false;
    }
  );

  function updateTouchDirection(
    clientY
  ) {
    const rect =
      canvas.getBoundingClientRect();

    const localY =
      clientY -
      rect.top;

    touchDirection =
      localY <
      rect.height / 2
        ? -1
        : 1;
  }

  canvas.addEventListener(
    "pointerdown",
    event => {
      if (
        event.pointerType ===
          "touch" ||
        event.pointerType ===
          "pen"
      ) {
        event.preventDefault();

        updateTouchDirection(
          event.clientY
        );

        try {
          canvas.setPointerCapture(
            event.pointerId
          );
        } catch (_) {}
      }
    }
  );

  canvas.addEventListener(
    "pointermove",
    event => {
      if (
        event.pointerType ===
          "touch" ||
        event.pointerType ===
          "pen"
      ) {
        event.preventDefault();

        updateTouchDirection(
          event.clientY
        );
      }
    }
  );

  canvas.addEventListener(
    "pointerup",
    event => {
      if (
        event.pointerType ===
          "touch" ||
        event.pointerType ===
          "pen"
      ) {
        touchDirection =
          0;
      }
    }
  );

  canvas.addEventListener(
    "pointercancel",
    () =>
      touchDirection = 0
  );

  function loop(now) {
    const dt =
      Math.min(
        (now - lastTime) /
          1000,
        0.033
      );

    lastTime =
      now;

    update(dt);
    draw();

    window.requestAnimationFrame(
      loop
    );
  }

  draw();

  window.requestAnimationFrame(
    loop
  );
})();
</script>
</body>
</html>
