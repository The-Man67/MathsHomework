    try {

        const raw =
            localStorage.getItem(
                SAVE_KEY

        if (!raw) {

            save =
                defaultSave();

            saveGame();

            return;

        }

            JSON.parse(raw);

            Number.isFinite(

    value,
    length
) {

    if (
        typeof value !== "string"
    ) {

        return false;

    }


    if (
        value.length !== length
    ) {

        return false;

    }


    for (
        const character of value

        if (
            !CODE_ALPHABET.includes(
                character
            )
        ) {

            return false;

        }

    }


    return true;

}

            window.crypto.getRandomValues

                    length
                );


            window.crypto.getRandomValues(

                i < length;
                i++

                result +=
                    CODE_ALPHABET[
                        values[i] %
                        CODE_ALPHABET.length
                    ];

            }


            return result;

        }

    } catch (error) {

    }


    for (
        let i = 0;
        i < length;
        i++
    ) {

        result +=
            CODE_ALPHABET[
                Math.floor(
                    Math.random() *
                    CODE_ALPHABET.length

    return result;

}

function rightRotate(
    value,
    amount
) {

    return (
        value >>> amount
    ) |
    (
        value << (
            32 - amount
        )
    );

}


async function sha256(
    input
) {

    const data =
        new TextEncoder().encode(
            input
        );


    if (
        window.crypto &&
        window.crypto.subtle
    ) {

        try {

            const hash =
                await window.crypto.subtle.digest(
                    "SHA-256",
                    data
                );


            const bytes =
                new Uint8Array(
                    hash
                );


            let result = "";


            for (
                const byte of bytes
            ) {

                result +=
                    byte
                        .toString(16)
                        .padStart(
                            2,
                            "0"
                        );

            }


            return result;

        } catch (error) {

        }

    }


    return sha256Fallback(
        data
    );

}


function sha256Fallback(
    bytes
) {

    const bitLength =
        bytes.length * 8;


    const paddedLength =
        (
            Math.ceil(
                (
                    bytes.length + 9
                ) / 64
            )
        ) * 64;


    const message =
        new Uint8Array(
            paddedLength
        );


    message.set(
        bytes
    );


    message[
        bytes.length
    ] =
        0x80;


    const high =
        Math.floor(
            bitLength /
            0x100000000
        );


    const low =
        bitLength >>> 0;


    message[
        paddedLength - 8
    ] =
        high >>> 24;


    message[
        paddedLength - 7
    ] =
        high >>> 16;


    message[
        paddedLength - 6
    ] =
        high >>> 8;


    message[
        paddedLength - 5
    ] =
        high;


    message[
        paddedLength - 4
    ] =
        low >>> 24;


    message[
        paddedLength - 3
    ] =
        low >>> 16;


    message[
        paddedLength - 2
    ] =
        low >>> 8;


    message[
        paddedLength - 1
    ] =
        low;


    let h0 =
        0x6a09e667;

    let h1 =
        0xbb67ae85;

    let h2 =
        0x3c6ef372;

    let h3 =
        0xa54ff53a;

    let h4 =
        0x510e527f;

    let h5 =
        0x9b05688c;

    let h6 =
        0x1f83d9ab;

    let h7 =
        0x5be0cd19;


    const w =
        new Uint32Array(
            64
        );


    for (
        let offset = 0;
        offset < paddedLength;
        offset += 64
    ) {

        for (
            let i = 0;
            i < 16;
            i++
        ) {

            const p =
                offset +
                i * 4;


            w[i] =
                (
                    message[p] << 24
                ) |
                (
                    message[p + 1] << 16
                ) |
                (
                    message[p + 2] << 8
                ) |
                message[p + 3];

        }


        for (
            let i = 16;
            i < 64;
            i++
        ) {

            const s0 =
                rightRotate(
                    w[i - 15],
                    7
                ) ^
                rightRotate(
                    w[i - 15],
                    18
                ) ^
                (
                    w[i - 15] >>> 3
                );


            const s1 =
                rightRotate(
                    w[i - 2],
                    17
                ) ^
                rightRotate(
                    w[i - 2],
                    19
                ) ^
                (
                    w[i - 2] >>> 10
                );


            w[i] =
                (
                    w[i - 16] +
                    s0 +
                    w[i - 7] +
                    s1
                ) >>> 0;

            h2;

            h3;

/* =========================================================
   CODE EQUATION
========================================================= */

function characterValue(
    character
) {

    const index =
        CODE_ALPHABET.indexOf(
            character
        );


    if (
        index < 0
    ) {

        return -1;

    }


    return index + 11;

}


function calculateEquation(
    value
) {

    const values = [];


    for (
        const character of value
    ) {

        const number =
            characterValue(
                character
            );


        if (
            number < 0
        ) {

            return null;

        }


        values.push(
            number
        );

    }


    if (
        values.length < 16
    ) {

        return null;

    }


    let a =
        values[0] *
        values[2];


    let b =
        values[1] +
        values[3];


    let c =
        values[4] *
        7;


    let d =
        values[5] +
        values[6];


    let e =
        (
            a +
            b
        ) *
        c;


    let f =
        e +
        d;


    let g =
        f *
        values[7];


    let h =
        g +
        values[8];


    let i =
        h *
        values[9];


    let j =
        i +
        values[10];


    let k =
        (
            j *
            values[11]
        ) +
        (
            j ^
            values[11]
        );


    k =
        Math.abs(
            k %
            1000000007
        );


    let l =
        k +
        values[12];


    let m =
        l *
        values[13];


    let n =
        m +
        values[14];


    let result =
        n *
        values[15];


    result =
        Math.abs(
            result %
            1000000007
        );


    return result;

}

                .toUpperCase();


        currentCodeA =
            CODE_A_PREFIX +
            "-" +
            installationId +
            "-" +
            currentRedemptionId +
            "-" +
            checksum;


        redemptionMessage =
            "Redemption code ready.";


    } catch (error) {

        currentCodeA = "";


        redemptionMessage =
            "Unable to generate redemption code.";

    }


    codeAGenerating =
        false;

}


/* =========================================================
   COPY
========================================================= */

async function copyCurrentCodeA() {

    if (
        !currentCodeA
    ) {

        redemptionMessage =
            "There is no redemption code to copy.";

        return;

    }


    try {

        await navigator.clipboard.writeText(
            currentCodeA
        );


        redemptionMessage =
            "Redemption code copied.";

        return;

    } catch (error) {

    }


    try {

        const area =
            document.createElement(
                "textarea"
            );


        area.value =
            currentCodeA;


        area.style.position =
            "fixed";


        area.style.left =
            "-9999px";


        document.body.appendChild(
            area
        );


        area.focus();


        area.select();


        document.execCommand(
            "copy"
        );


        document.body.removeChild(
            area
        );


        redemptionMessage =
            "Redemption code copied.";

    } catch (error) {

        redemptionMessage =
            "Copy failed. Copy the code manually.";

    }

}

        event.stopPropagation();

    }
);

/* =========================================================
   CODE ISN'T WORKING
========================================================= */

async function requestNewCode() {

    if (
        cooldownActive
    ) {

        state =
            STATES.COOLDOWN;

        hideRedeemControls();

        return;

    }


    if (
        retryCount >=
        MAX_RETRIES
    ) {

        beginCooldown();

        return;

    }


    retryCount++;


    await createCodeA();


    redemptionMessage =
        "New redemption code generated. Attempt " +
        retryCount +
        " of " +
        MAX_RETRIES + ".";

}


/* =========================================================
   COOLDOWN
========================================================= */

function beginCooldown() {

    cooldownActive =
        true;


    cooldownRemaining =
        COOLDOWN_SECONDS;


    cooldownLastUpdate =
        performance.now();


    state =
        STATES.COOLDOWN;


    hideRedeemControls();

}


function updateCooldown(
    now
) {

    if (
        !cooldownActive
    ) {

        return;

    }


    const elapsed =
        (
            now -
            cooldownLastUpdate
        ) / 1000;


    cooldownLastUpdate =
        now;


    cooldownRemaining -=
        elapsed;


    if (
        cooldownRemaining <=
        0
    ) {

        cooldownRemaining = 0;

        cooldownActive = false;

        retryCount = 0;

        redemptionMessage =
            "Cooldown complete. You have 3 new attempts.";

        state =
            STATES.REDEEM;

        createCodeA();

        showRedeemControls();

    }

}


/* =========================================================
   PADDLES
========================================================= */

const PADDLE_WIDTH = 18;

const PADDLE_HEIGHT = 110;

const PLAYER_X = 40;

const AI_X =
    WIDTH - 58;


let playerY =
    HEIGHT / 2 -
    PADDLE_HEIGHT / 2;

let aiY =
    HEIGHT / 2 -
    PADDLE_HEIGHT / 2;


/* =========================================================
   BALL
========================================================= */

const BALL_SIZE = 16;


let ballX =
    WIDTH / 2;


let ballY =
    HEIGHT / 2;


let ballVX = 0;

let ballVY = 0;

let ballSpeed = 0;


/* =========================================================
   SCORE
========================================================= */

let playerScore = 0;

let aiScore = 0;


/* =========================================================
   MATCH
========================================================= */

let gameRunning = false;

let paused = false;

let matchResult = "";


/* =========================================================
   KEYBOARD STATE
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.key
        ] = true;

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key
        ] = false;

    }
);


/* =========================================================
   CURRENT DIFFICULTY
========================================================= */

function getDifficulty() {

    return difficulties[
        save.difficulty
    ];

}


/* =========================================================
   ROUND COST
========================================================= */

function getRoundCost(
    difficultyIndex,
    roundIndex
) {

    const multiplier =
        difficultyIndex === 0
            ? 1
            : difficultyIndex === 1
                ? 2
                : 5;


    return (
        slowRoundCosts[
            roundIndex
        ] *
        multiplier
    );

}


function getRoundWinning(
    difficultyIndex,
    roundIndex
) {

    return (
        getRoundCost(
            difficultyIndex,
            roundIndex
        ) *
        2
    );

}


/* =========================================================
   START ROUND
========================================================= */

function startRound(
    roundNumber
) {

    const index =
        roundNumber - 1;


    const cost =
        getRoundCost(
            save.difficulty,
            index
        );


    if (
        save.tokens < cost
    ) {

        redemptionMessage =
            "You need " +
            cost +
            " tokens to play this round.";


        state =
            STATES.TOKENS;


        return;

    }


    save.tokens -=
        cost;


    saveGame();


    playerScore = 0;

    aiScore = 0;


    playerY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;


    aiY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;


    paused = false;

    gameRunning = true;

    matchResult = "";


    resetBall(
        Math.random() < 0.5
            ? -1
            : 1
    );


    state =
        STATES.PLAYING;

}


/* =========================================================
   BALL RESET
========================================================= */

function resetBall(
    direction
) {

    const difficulty =
        getDifficulty();


    const roundMultiplier =
        1 +
        (
            save.currentRound - 1
        ) *
        0.08;


    ballX =
        WIDTH / 2;


    ballY =
        HEIGHT / 2;


    ballSpeed =
        Math.min(
            difficulty.ballStartSpeed *
            roundMultiplier,
            difficulty.ballMaxSpeed
        );


    const angle =
        Math.random() *
        0.75 -
        0.375;


    ballVX =
        ballSpeed *
        direction;


    ballVY =
        ballSpeed *
        angle;

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(
    dt
) {

    let movement = 0;


    if (
        keys["w"] ||
        keys["W"] ||
        keys["ArrowUp"]
    ) {

        movement -= 1;

    }


    if (
        keys["s"] ||
        keys["S"] ||
        keys["ArrowDown"]
    ) {

        movement += 1;

    }


    playerY +=
        movement *
        540 *
        dt;


    if (
        playerY < 0
    ) {

        playerY = 0;

    }


    if (
        playerY >
        HEIGHT -
        PADDLE_HEIGHT
    ) {

        playerY =
            HEIGHT -
            PADDLE_HEIGHT;

    }

}


/* =========================================================
   AI
========================================================= */

function updateAI(
    dt
) {

    const difficulty =
        getDifficulty();


    const target =
        ballY -
        PADDLE_HEIGHT / 2;


    const roundMultiplier =
        1 +
        (
            save.currentRound - 1
        ) *
        0.035;


    const speed =
        difficulty.aiSpeed *
        roundMultiplier;


    if (
        aiY < target
    ) {

        aiY +=
            speed *
            dt;

    }


    if (
        aiY > target
    ) {

        aiY -=
            speed *
            dt;

    }


    if (
        aiY < 0
    ) {

        aiY = 0;

    }


    if (
        aiY >
        HEIGHT -
        PADDLE_HEIGHT
    ) {

        aiY =
            HEIGHT -
            PADDLE_HEIGHT;

    }

}


/* =========================================================
   BALL
========================================================= */

function updateBall(
    dt
) {

    ballX +=
        ballVX *
        dt;


    ballY +=
        ballVY *
        dt;


    if (
        ballY -
        BALL_SIZE / 2 <=
        0
    ) {

        ballY =
            BALL_SIZE / 2;


        ballVY =
            Math.abs(
                ballVY
            );

    }


    if (
        ballY +
        BALL_SIZE / 2 >=
        HEIGHT
    ) {

        ballY =
            HEIGHT -
            BALL_SIZE / 2;


        ballVY =
            -Math.abs(
                ballVY
            );

    }


    if (
        ballVX < 0 &&
        ballX -
        BALL_SIZE / 2 <=
        PLAYER_X +
        PADDLE_WIDTH &&
        ballX +
        BALL_SIZE / 2 >=
        PLAYER_X &&
        ballY >=
        playerY &&
        ballY <=
        playerY +
        PADDLE_HEIGHT
    ) {

        ballX =
            PLAYER_X +
            PADDLE_WIDTH +
            BALL_SIZE / 2;


        bounceFromPaddle(
            playerY,
            true
        );

    }


    if (
        ballVX > 0 &&
        ballX +
        BALL_SIZE / 2 >=
        AI_X &&
        ballX -
        BALL_SIZE / 2 <=
        AI_X +
        PADDLE_WIDTH &&
        ballY >=
        aiY &&
        ballY <=
        aiY +
        PADDLE_HEIGHT
    ) {

        ballX =
            AI_X -
            BALL_SIZE / 2;


        bounceFromPaddle(
            aiY,
            false
        );

    }


    if (
        ballX < -40
    ) {

        aiScore++;

        checkScore();

    }


    if (
        ballX >
        WIDTH + 40
    ) {

        playerScore++;

        checkScore();

    }

}


/* =========================================================
   BOUNCE
========================================================= */

function bounceFromPaddle(
    paddleY,
    playerSide
) {

    const difficulty =
        getDifficulty();


    const relative =
        (
            ballY -
            (
                paddleY +
                PADDLE_HEIGHT / 2
            )
        ) /
        (
            PADDLE_HEIGHT / 2
        );


    ballSpeed =
        Math.min(
            ballSpeed * 1.045,
            difficulty.ballMaxSpeed
        );


    ballVY =
        relative *
        ballSpeed *
        0.82;


    const horizontal =
        Math.sqrt(
            Math.max(
                0,
                ballSpeed *
                ballSpeed -
                ballVY *
                ballVY
            )
        );


    ballVX =
        playerSide
            ? horizontal
            : -horizontal;

}


/* =========================================================
   SCORE
========================================================= */

function checkScore() {

    const target =
        roundTargets[
            save.currentRound - 1
        ];


    if (
        playerScore >= target
    ) {

        finishRound(
            true
        );

        return;

    }


    if (
        aiScore >= target
    ) {

        finishRound(
            false
        );

        return;

    }


    resetBall(
        playerScore > aiScore
            ? -1
            : 1
    );

}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound(
    playerWon
) {

    gameRunning = false;


    matchResult =
        playerWon
            ? "WIN"
            : "LOSS";


    if (
        playerWon
    ) {

        const winnings =
            getRoundWinning(
                save.difficulty,
                save.currentRound - 1
            );


        save.tokens +=
            winnings;

    }


    if (
        playerWon &&
        save.currentRound === 5
    ) {

        if (
            save.unlockedDifficulty < 2
        ) {

            save.unlockedDifficulty++;

        }

    }


    saveGame();


    resultSelection = 0;


    state =
        STATES.RESULT;

}


/* =========================================================
   RESULT
========================================================= */

function chooseResult() {

    if (
        resultSelection === 0
    ) {

        if (
            matchResult === "WIN" &&
            save.currentRound < 5
        ) {

            save.currentRound++;

            saveGame();

        }


        const cost =
            getRoundCost(
                save.difficulty,
                save.currentRound - 1
            );


        if (
            save.tokens < cost
        ) {

            state =
                STATES.TOKENS;

            return;

        }


        startRound(
            save.currentRound
        );


        return;

    }


    state =
        STATES.MENU;

}


/* =========================================================
   SELECTION MOVEMENT
========================================================= */

function menuMove(
    direction
) {

    menuSelection +=
        direction;


    if (
        menuSelection < 0
    ) {

        menuSelection = 1;

    }


    if (
        menuSelection > 1
    ) {

        menuSelection = 0;

    }

}


function difficultyMove(
    direction
) {

    difficultySelection +=
        direction;


    if (
        difficultySelection < 0
    ) {

        difficultySelection = 0;

    }


    if (
        difficultySelection >
        save.unlockedDifficulty
    ) {

        difficultySelection =
            save.unlockedDifficulty;

    }


    if (
        difficultySelection > 2
    ) {

        difficultySelection = 2;

    }

}


function roundMove(
    direction
) {

    roundSelection +=
        direction;


    if (
        roundSelection < 0
    ) {

        roundSelection = 0;

    }


    if (
        roundSelection > 4
    ) {

        roundSelection = 4;

    }

}


function resultMove(
    direction
) {

    resultSelection +=
        direction;


    if (
        resultSelection < 0
    ) {

        resultSelection = 1;

    }


    if (
        resultSelection > 1
    ) {

        resultSelection = 0;

    }

}


function tokenMove(
    direction
) {

    tokenSelection +=
        direction;


    if (
        tokenSelection < 0
    ) {

        tokenSelection = 1;

    }


    if (
        tokenSelection > 1
    ) {

        tokenSelection = 0;

    }


}


/* =========================================================
   ENTER ACTIONS
========================================================= */

function activateCurrentSelection() {

    if (
        state === STATES.MENU
    ) {

        if (
            menuSelection === 0
        ) {

            state =
                STATES.DIFFICULTY;

        } else {

            state =
                STATES.TOKENS;

        }


        return;

    }


    if (
        state === STATES.DIFFICULTY
    ) {

        save.difficulty =
            difficultySelection;


        saveGame();


        roundSelection =
            save.currentRound - 1;


        state =
            STATES.ROUND;


        return;

    }


    if (
        state === STATES.ROUND
    ) {

        const cost =
            getRoundCost(
                save.difficulty,
                roundSelection
            );


        if (
            save.tokens < cost
        ) {

            redemptionMessage =
                "You need " +
                cost +
                " tokens to play this round.";


            state =
                STATES.TOKENS;


            return;

        }


        save.currentRound =
            roundSelection + 1;


        saveGame();


        startRound(
            save.currentRound
        );


        return;

    }


    if (
        state === STATES.RESULT
    ) {

        chooseResult();

        return;

    }


    if (
        state === STATES.TOKENS
    ) {

        if (
            tokenSelection === 0
        ) {

            state =
                STATES.REDEEM;


            showRedeemControls();


            return;

        }


        state =
            STATES.MENU;


        return;

    }


    if (
        state === STATES.REDEEM
    ) {

        if (
            redeemSelection === 0
        ) {

            copyCurrentCodeA();

        }


        if (
            redeemSelection === 1
        ) {

            requestNewCode();

        }


        if (
            redeemSelection === 2
        ) {

            attemptTokenCode();

        }


        if (
            redeemSelection === 3
        ) {

            state =
                STATES.TOKENS;

            hideRedeemControls();

        }


        return;

    }


    if (
        state === STATES.PAUSED
    ) {

        paused = false;

        state =
            STATES.PLAYING;

    }

}


/* =========================================================
   ENTER KEY
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            state === STATES.REDEEM &&
            document.activeElement === tokenInput
        ) {

            if (
                event.key === "Escape"
            ) {

                tokenInput.blur();

                state =
                    STATES.TOKENS;

                hideRedeemControls();

                event.preventDefault();

            }


            return;

        }


        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            activateCurrentSelection();

        }

    }
);


/* =========================================================
   SPACE
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== " " &&
            event.code !== "Space"
        ) {

            return;

        }


        if (
            state === STATES.PLAYING
        ) {

            event.preventDefault();

            paused = true;

            state =
                STATES.PAUSED;

        } else if (
            state === STATES.PAUSED
        ) {

            event.preventDefault();

            paused = false;

            state =
                STATES.PLAYING;

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== "Escape"
        ) {

            return;

        }


        if (
            state === STATES.PLAYING
        ) {

            paused = true;

            state =
                STATES.PAUSED;

            return;

        }


        if (
            state === STATES.PAUSED
        ) {

            paused = false;

            state =
                STATES.PLAYING;

            return;

        }


        if (
            state === STATES.DIFFICULTY ||
            state === STATES.TOKENS
        ) {

            state =
                STATES.MENU;

            return;

        }


        if (
            state === STATES.ROUND
        ) {

            state =
                STATES.DIFFICULTY;

            return;

        }


        if (
            state === STATES.RESULT
        ) {

            state =
                STATES.ROUND;

            return;

        }


        if (
            state === STATES.REDEEM
        ) {

            tokenInput.blur();

            state =
                STATES.TOKENS;

            hideRedeemControls();

            return;

        }


        if (
            state === STATES.COOLDOWN
        ) {

            state =
                STATES.TOKENS;

        }

    }
);


/* =========================================================
   W / S / ARROWS
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            document.activeElement === tokenInput
        ) {

            return;

        }


        const key =
            event.key;


        if (
            state === STATES.MENU
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                menuMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                menuMove(1);

            }

            return;

        }


        if (
            state === STATES.DIFFICULTY
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                difficultyMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                difficultyMove(1);

            }

            return;

        }


        if (
            state === STATES.ROUND
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                roundMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                roundMove(1);

            }

            return;

        }


        if (
            state === STATES.RESULT
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                resultMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                resultMove(1);

            }

            return;

        }


        if (
            state === STATES.TOKENS
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                tokenMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                tokenMove(1);

            }

            return;

        }


        if (
            state === STATES.REDEEM
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                redeemSelection--;

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                redeemSelection++;

            }


            if (
                redeemSelection < 0
            ) {

                redeemSelection = 3;

            }


            if (
                redeemSelection > 3
            ) {

                redeemSelection = 0;

            }

        }

    }
);


/* =========================================================
   REDEEM
========================================================= */

async function attemptTokenCode() {

    const value =
        tokenInput.value
            .trim()
            .replace(
                /\s+/g,
                ""
            )
            .toUpperCase();


    if (
        value.length === 0
    ) {

        redemptionMessage =
            "Enter a token code first.";

        tokenInput.focus();

        return;

    }


    /*
       Real Ed25519 verification and awarding will be
       connected after the genuine Worker signing key
       has been established and tested.
    */

    redemptionMessage =
        "Token code received. Verification is not connected yet.";

}


/* =========================================================
   SHOW / HIDE REDEMPTION CONTROLS
========================================================= */

function showRedeemControls() {

    tokenInput.style.display =
        "block";


    copyButton.style.display =
        "block";


    tokenInput.value =
        tokenInput.value;

}


function hideRedeemControls() {

    tokenInput.style.display =
        "none";


    copyButton.style.display =
        "none";


    tokenInput.blur();

}


/* =========================================================
   UI HITBOX
========================================================= */

function hit(
    x,
    y,
    width,
    height,
    mouseX,
    mouseY
) {

    return (
        mouseX >= x &&
        mouseX <= x + width &&
        mouseY >= y &&
        mouseY <= y + height
    );

}


/* =========================================================
   POINTER POSITION
========================================================= */

function getPointerPosition(
    event
) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (
                event.clientX -
                rect.left
            ) *
            WIDTH /
            rect.width,

        y:
            (
                event.clientY -
                rect.top
            ) *
            HEIGHT /
            rect.height

    };

}


/* =========================================================
   POINTER CLICK
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        const point =
            getPointerPosition(
                event
            );


        handleCanvasClick(
            point.x,
            point.y
        );

    }
);


/* =========================================================
   CANVAS CLICK HANDLER
========================================================= */

function handleCanvasClick(
    x,
    y
) {

    /*
       Playing field:
       clicking doesn't operate menus.
    */

    if (
        state === STATES.PLAYING
    ) {

        return;

    }


    if (
        state === STATES.PAUSED
    ) {

        if (
            hit(
                340,
                255,
                280,
                90,
                x,
                y
            )
        ) {

            paused = false;

            state =
                STATES.PLAYING;

        }


        return;

    }


    /* =====================================================
       MAIN MENU
    ===================================================== */

    if (
        state === STATES.MENU
    ) {

        if (
            hit(
                WIDTH / 2 - 220,
                255,
                440,
                65,
                x,
                y
            )
        ) {

            menuSelection = 0;

            activateCurrentSelection();

            return;

        }


        if (
            hit(
                WIDTH / 2 - 220,
                330,
                440,
                65,
                x,
                y
            )
        ) {

            menuSelection = 1;

            activateCurrentSelection();

            return;

        }


        return;

    }


    /* =====================================================
       DIFFICULTY
    ===================================================== */

    if (
        state === STATES.DIFFICULTY
    ) {

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            const yPosition =
                148 +
                i * 80;


            if (
                hit(
                    WIDTH / 2 - 230,
                    yPosition,
                    460,
                    64,
                    x,
                    y
                )
            ) {

                if (
                    i <=
                    save.unlockedDifficulty
                ) {

                    difficultySelection =
                        i;

                    activateCurrentSelection();

                }

                return;

            }

        }


        return;

    }


    /* =====================================================
       ROUND
    ===================================================== */

    if (
        state === STATES.ROUND
    ) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            const yPosition =
                181 +
                i * 62;


            if (
                hit(
                    WIDTH / 2 - 235,
                    yPosition,
                    470,
                    48,
                    x,
                    y
                )
            ) {

                roundSelection =
                    i;

                activateCurrentSelection();

                return;

            }

        }


        return;

    }


    /* =====================================================
       RESULT
    ===================================================== */

    if (
        state === STATES.RESULT
    ) {

        if (
            hit(
                WIDTH / 2 - 220,
                338,
                440,
                54,
                x,
                y
            )
        ) {

            resultSelection = 0;

            activateCurrentSelection();

            return;

        }


        if (
            hit(
                WIDTH / 2 - 220,
                408,
                440,
                54,
                x,
                y
            )
        ) {

            resultSelection = 1;

            activateCurrentSelection();

            return;

        }


        return;

    }


    /* =====================================================
       TOKENS
    ===================================================== */

    if (
        state === STATES.TOKENS
    ) {

        if (
            hit(
                WIDTH / 2 - 220,
                265,
                440,
                65,
                x,
                y
            )
        ) {

            tokenSelection = 0;

            activateCurrentSelection();

            return;

        }


        if (
            hit(
                WIDTH / 2 - 220,
                340,
                440,
                65,
                x,
                y
            )
        ) {

            tokenSelection = 1;

            activateCurrentSelection();

            return;

        }


        return;

    }


    /* =====================================================
       REDEMPTION
    ===================================================== */

    if (
        state === STATES.REDEEM
    ) {

        /*
           Token input box itself is a real HTML input,
           so the browser handles clicks and typing.
        */


        if (
            hit(
                45,
                405,
                280,
                50,
                x,
                y
            )
        ) {

            redeemSelection = 0;

            copyCurrentCodeA();

            return;

        }


        if (
            hit(
                340,
                405,
                280,
                50,
                x,
                y
            )
        ) {

            redeemSelection = 1;

            requestNewCode();

            return;

        }


        if (
            hit(
                635,
                405,
                280,
                50,
                x,
                y
            )
        ) {

            redeemSelection = 2;

            attemptTokenCode();

            return;

        }


        if (
            hit(
                WIDTH / 2 - 170,
                500,
                340,
                48,
                x,
                y
            )
        ) {

            redeemSelection = 3;

            state =
                STATES.TOKENS;

            hideRedeemControls();

            return;

        }


        return;

    }


    /* =====================================================
       COOLDOWN
    ===================================================== */

    if (
        state === STATES.COOLDOWN
    ) {

        if (
            hit(
                WIDTH / 2 - 170,
                450,
                340,
                50,
                x,
                y
            )
        ) {

            state =
                STATES.TOKENS;

        }

    }

}


/* =========================================================
   DRAW HELPERS
========================================================= */

function clearScreen(
    colour
) {

    ctx.fillStyle =
        colour;


    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

}


function drawText(
    value,
    x,
    y,
    size,
    colour,
    align = "center"
) {

    ctx.fillStyle =
        colour;


    ctx.font =
        "bold " +
        size +
        "px Arial";


    ctx.textAlign =
        align;


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        value,
        x,
        y
    );

}


function drawPanel(
    x,
    y,
    width,
    height,
    fill,
    border
) {

    ctx.fillStyle =
        fill;


    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.strokeStyle =
        border;


    ctx.lineWidth =
        2;


    ctx.strokeRect(
        x,
        y,
        width,
        height
    );

}


function drawButton(
    label,
    x,
    y,
    width,
    height,
    selected,
    fill = "#181818",
    border = "#444444",
    colour = "#ffffff"
) {

    let finalFill =
        fill;


    let finalBorder =
        border;


    let finalColour =
        colour;


    if (
        selected
    ) {

        finalFill =
            "#ffffff";

        finalBorder =
            "#ffffff";

        finalColour =
            "#111111";

    }


    drawPanel(
        x,
        y,
        width,
        height,
        finalFill,
        finalBorder
    );


    drawText(
        label,
        x + width / 2,
        y + height / 2,
        18,
        finalColour
    );

}

/* =========================================================
   DRAW
========================================================= */

function draw() {

    if (
        state === STATES.MENU
    ) {

        drawMenu();

        return;

    }


    if (
        state === STATES.DIFFICULTY
    ) {

        drawDifficulty();

        return;

    }


    if (
        state === STATES.ROUND
    ) {

        drawRound();

        return;

    }


    if (
        state === STATES.PLAYING ||
        state === STATES.PAUSED
    ) {

        drawGame();

        return;

    }


    if (
        state === STATES.RESULT
    ) {

        drawResult();

        return;

    }


    if (
        state === STATES.TOKENS
    ) {

        drawTokens();

        return;

    }


    if (
        state === STATES.REDEEM
    ) {

        drawRedeem();

        return;

    }


    if (
        state === STATES.COOLDOWN
    ) {

        drawCooldown();

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(
    dt
) {

    if (
        state === STATES.PLAYING
    ) {

        updatePlayer(dt);

        updateAI(dt);

        updateBall(dt);

    }

}


/* =========================================================
   MAIN LOOP
========================================================= */

let previousTime =
    performance.now();


function loop(
    now
) {

    let dt =
        (
            now -
            previousTime
        ) / 1000;


    previousTime =
        now;


    if (
        dt > 0.033
    ) {

        dt = 0.033;

    }


    update(dt);

    updateCooldown(now);

    draw();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   START
========================================================= */

createCodeA();

hideRedeemControls();

draw();

requestAnimationFrame(
    loop
);
