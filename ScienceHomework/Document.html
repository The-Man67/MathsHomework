<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #101010;
    color: #ffffff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#game {
    width: min(96vw, 1100px);
    height: auto;
    aspect-ratio: 16 / 10;
    background: #181818;
    border: 2px solid #444444;
    display: block;
}
</style>
</head>

<body>

<canvas id="game" width="960" height="600"></canvas>

<script>

"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 960;
const HEIGHT = 600;


/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY = "pong_local_save_v2";


function defaultSave() {

    return {
        tokens: 10,
        difficulty: 0,
        unlockedDifficulty: 0,
        currentRound: 1
    };

}


let save;


function loadSave() {

    try {

        const raw = localStorage.getItem(SAVE_KEY);

        if (!raw) {

            save = defaultSave();
            saveGame();
            return;

        }

        const parsed = JSON.parse(raw);

        save = defaultSave();

        if (Number.isFinite(parsed.tokens)) {

            save.tokens =
                Math.max(
                    0,
                    Math.floor(parsed.tokens)
                );

        }

        if (Number.isFinite(parsed.difficulty)) {

            save.difficulty =
                Math.max(
                    0,
                    Math.min(
                        2,
                        Math.floor(parsed.difficulty)
                    )
                );

        }

        if (Number.isFinite(parsed.unlockedDifficulty)) {

            save.unlockedDifficulty =
                Math.max(
                    0,
                    Math.min(
                        2,
                        Math.floor(parsed.unlockedDifficulty)
                    )
                );

        }

        if (Number.isFinite(parsed.currentRound)) {

            save.currentRound =
                Math.max(
                    1,
                    Math.min(
                        5,
                        Math.floor(parsed.currentRound)
                    )
                );

        }

        if (
            save.difficulty >
            save.unlockedDifficulty
        ) {

            save.difficulty =
                save.unlockedDifficulty;

        }

    } catch (error) {

        save = defaultSave();

    }

}


function saveGame() {

    try {

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(save)
        );

    } catch (error) {

    }

}


loadSave();


/* =========================================================
   DIFFICULTIES
========================================================= */

const difficulties = [

    {
        name: "SLOW",

        ballStartSpeed: 350,
        ballMaxSpeed: 650,

        aiSpeed: 300,

        background: "#181818",
        primary: "#ffffff",
        secondary: "#444444",
        panel: "#222222",
        border: "#555555",
        muted: "#888888"
    },

    {
        name: "NORMAL",

        ballStartSpeed: 410,
        ballMaxSpeed: 760,

        aiSpeed: 390,

        background: "#0b2516",
        primary: "#39ff88",
        secondary: "#174b2c",
        panel: "#10331f",
        border: "#27834d",
        muted: "#6fc894"
    },

    {
        name: "HARD",

        ballStartSpeed: 470,
        ballMaxSpeed: 900,

        aiSpeed: 475,

        background: "#2a0b0b",
        primary: "#ff4d4d",
        secondary: "#581919",
        panel: "#3a1111",
        border: "#9c2c2c",
        muted: "#d87878"
    }

];


/* =========================================================
   ROUND TARGETS
========================================================= */

const roundTargets = [
    5,
    10,
    15,
    20,
    25
];


/* =========================================================
   ROUND COSTS
   Slow:
   1, 3, 7, 15, 31
========================================================= */

const slowRoundCosts = [
    1,
    3,
    7,
    15,
    31
];


/* =========================================================
   GAME STATES
========================================================= */

const STATES = {

    MENU: "menu",
    DIFFICULTY: "difficulty",
    ROUND: "round",
    PLAYING: "playing",
    PAUSED: "paused",
    RESULT: "result",
    TOKENS: "tokens",
    REDEEM: "redeem",
    COOLDOWN: "cooldown"

};


let state = STATES.MENU;


/* =========================================================
   MENU
========================================================= */

let menuSelection = 0;

let difficultySelection =
    save.difficulty;

let roundSelection =
    save.currentRound - 1;

let resultSelection = 0;

let tokenSelection = 0;


/* =========================================================
   REDEMPTION
========================================================= */

let retryCount = 0;

const MAX_RETRIES = 3;

const COOLDOWN_SECONDS = 300;

let cooldownRemaining = 0;

let cooldownLastUpdate = 0;

let redemptionMessage = "";

let codeInput = "";


/* =========================================================
   PADDLES
========================================================= */

const PADDLE_WIDTH = 18;
const PADDLE_HEIGHT = 110;

const PLAYER_X = 40;
const AI_X = WIDTH - 58;

let playerY =
    HEIGHT / 2 -
    PADDLE_HEIGHT / 2;

let aiY =
    HEIGHT / 2 -
    PADDLE_HEIGHT / 2;


/* =========================================================
   BALL
========================================================= */

const BALL_SIZE = 16;

let ballX =
    WIDTH / 2;

let ballY =
    HEIGHT / 2;

let ballVX = 0;
let ballVY = 0;

let ballSpeed = 0;


/* =========================================================
   SCORE
========================================================= */

let playerScore = 0;
let aiScore = 0;


/* =========================================================
   MATCH
========================================================= */

let gameRunning = false;

let paused = false;

let matchResult = "";


/* =========================================================
   INPUT
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[event.key] = true;

        if (
            event.key === " " ||
            event.code === "Space"
        ) {

            event.preventDefault();

            if (
                state === STATES.PLAYING
            ) {

                paused = true;
                state = STATES.PAUSED;

            } else if (
                state === STATES.PAUSED
            ) {

                paused = false;
                state = STATES.PLAYING;

            }

        }


        if (
            event.key === "Escape"
        ) {

            handleEscape();

        }


        handleEnter(event);

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[event.key] = false;

    }
);


/* =========================================================
   GET CURRENT DIFFICULTY
========================================================= */

function getDifficulty() {

    return difficulties[
        save.difficulty
    ];

}


/* =========================================================
   GET ROUND COST
========================================================= */

function getRoundCost(
    difficultyIndex,
    roundIndex
) {

    const multiplier =
        difficultyIndex === 0
            ? 1
            : difficultyIndex === 1
                ? 2
                : 5;


    return (
        slowRoundCosts[roundIndex] *
        multiplier
    );

}


/* =========================================================
   GET ROUND WINNING
========================================================= */

function getRoundWinning(
    difficultyIndex,
    roundIndex
) {

    return (
        getRoundCost(
            difficultyIndex,
            roundIndex
        ) *
        2
    );

}


/* =========================================================
   MENU MOVE
========================================================= */

function menuMove(direction) {

    menuSelection += direction;


    if (
        menuSelection < 0
    ) {

        menuSelection = 1;

    }


    if (
        menuSelection > 1
    ) {

        menuSelection = 0;

    }

}


/* =========================================================
   DIFFICULTY MOVE
========================================================= */

function difficultyMove(direction) {

    difficultySelection += direction;


    if (
        difficultySelection < 0
    ) {

        difficultySelection = 0;

    }


    if (
        difficultySelection >
        save.unlockedDifficulty
    ) {

        difficultySelection =
            save.unlockedDifficulty;

    }


    if (
        difficultySelection > 2
    ) {

        difficultySelection = 2;

    }

}


/* =========================================================
   ROUND MOVE
========================================================= */

function roundMove(direction) {

    roundSelection += direction;


    if (
        roundSelection < 0
    ) {

        roundSelection = 0;

    }


    if (
        roundSelection > 4
    ) {

        roundSelection = 4;

    }

}


/* =========================================================
   RESULT MOVE
========================================================= */

function resultMove(direction) {

    resultSelection += direction;


    if (
        resultSelection < 0
    ) {

        resultSelection = 1;

    }


    if (
        resultSelection > 1
    ) {

        resultSelection = 0;

    }

}


/* =========================================================
   TOKEN MOVE
========================================================= */

function tokenMove(direction) {

    tokenSelection += direction;


    if (
        tokenSelection < 0
    ) {

        tokenSelection = 1;

    }


    if (
        tokenSelection > 1
    ) {

        tokenSelection = 0;

    }

}


/* =========================================================
   ENTER
========================================================= */

function handleEnter(event) {

    if (
        event.key !== "Enter"
    ) {

        return;

    }


    if (
        state === STATES.MENU
    ) {

        if (
            menuSelection === 0
        ) {

            state = STATES.DIFFICULTY;

        } else {

            state = STATES.TOKENS;

        }

        return;

    }


    if (
        state === STATES.DIFFICULTY
    ) {

        save.difficulty =
            difficultySelection;

        saveGame();

        roundSelection =
            save.currentRound - 1;

        state = STATES.ROUND;

        return;

    }


    if (
        state === STATES.ROUND
    ) {

        chooseRound();

        return;

    }


    if (
        state === STATES.RESULT
    ) {

        chooseResult();

        return;

    }


    if (
        state === STATES.TOKENS
    ) {

        if (
            tokenSelection === 0
        ) {

            state = STATES.REDEEM;

        } else {

            state = STATES.MENU;

        }

        return;

    }

}


/* =========================================================
   ESCAPE
========================================================= */

function handleEscape() {

    if (
        state === STATES.PLAYING
    ) {

        paused = true;
        state = STATES.PAUSED;
        return;

    }


    if (
        state === STATES.PAUSED
    ) {

        paused = false;
        state = STATES.PLAYING;
        return;

    }


    if (
        state === STATES.DIFFICULTY ||
        state === STATES.TOKENS
    ) {

        state = STATES.MENU;
        return;

    }


    if (
        state === STATES.ROUND
    ) {

        state = STATES.DIFFICULTY;
        return;

    }


    if (
        state === STATES.RESULT
    ) {

        state = STATES.ROUND;
        return;

    }


    if (
        state === STATES.REDEEM ||
        state === STATES.COOLDOWN
    ) {

        state = STATES.TOKENS;
        return;

    }

}


/* =========================================================
   ROUND CHOICE
========================================================= */

function chooseRound() {

    const selectedRound =
        roundSelection + 1;

    const cost =
        getRoundCost(
            save.difficulty,
            roundSelection
        );


    if (
        save.tokens < cost
    ) {

        redemptionMessage =
            "You need " +
            cost +
            " tokens to play this round.";

        state = STATES.TOKENS;

        return;

    }


    save.currentRound =
        selectedRound;

    saveGame();

    startRound(
        selectedRound
    );

}


/* =========================================================
   START ROUND
========================================================= */

function startRound(
    roundNumber
) {

    const roundIndex =
        roundNumber - 1;

    const cost =
        getRoundCost(
            save.difficulty,
            roundIndex
        );


    if (
        save.tokens < cost
    ) {

        state = STATES.TOKENS;
        return;

    }


    save.tokens -= cost;

    saveGame();


    playerScore = 0;
    aiScore = 0;


    playerY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;

    aiY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;


    paused = false;

    gameRunning = true;

    matchResult = "";


    resetBall(
        Math.random() < 0.5
            ? -1
            : 1
    );


    state = STATES.PLAYING;

}


/* =========================================================
   BALL RESET
========================================================= */

function resetBall(direction) {

    const difficulty =
        getDifficulty();


    const roundMultiplier =
        1 +
        (
            save.currentRound - 1
        ) *
        0.08;


    ballX =
        WIDTH / 2;

    ballY =
        HEIGHT / 2;


    ballSpeed =
        Math.min(
            difficulty.ballStartSpeed *
            roundMultiplier,
            difficulty.ballMaxSpeed
        );


    const angle =
        Math.random() *
        0.75 -
        0.375;


    ballVX =
        ballSpeed *
        direction;

    ballVY =
        ballSpeed *
        angle;

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt) {

    let movement = 0;


    if (
        keys["w"] ||
        keys["W"] ||
        keys["ArrowUp"]
    ) {

        movement -= 1;

    }


    if (
        keys["s"] ||
        keys["S"] ||
        keys["ArrowDown"]
    ) {

        movement += 1;

    }


    playerY +=
        movement *
        540 *
        dt;


    if (
        playerY < 0
    ) {

        playerY = 0;

    }


    if (
        playerY >
        HEIGHT -
        PADDLE_HEIGHT
    ) {

        playerY =
            HEIGHT -
            PADDLE_HEIGHT;

    }

}


/* =========================================================
   AI
========================================================= */

function updateAI(dt) {

    const difficulty =
        getDifficulty();


    const target =
        ballY -
        PADDLE_HEIGHT / 2;


    const roundMultiplier =
        1 +
        (
            save.currentRound - 1
        ) *
        0.035;


    const speed =
        difficulty.aiSpeed *
        roundMultiplier;


    if (
        aiY < target
    ) {

        aiY +=
            speed *
            dt;

    }


    if (
        aiY > target
    ) {

        aiY -=
            speed *
            dt;

    }


    if (
        aiY < 0
    ) {

        aiY = 0;

    }


    if (
        aiY >
        HEIGHT -
        PADDLE_HEIGHT
    ) {

        aiY =
            HEIGHT -
            PADDLE_HEIGHT;

    }

}


/* =========================================================
   BALL
========================================================= */

function updateBall(dt) {

    ballX +=
        ballVX *
        dt;

    ballY +=
        ballVY *
        dt;


    if (
        ballY -
        BALL_SIZE / 2 <=
        0
    ) {

        ballY =
            BALL_SIZE / 2;

        ballVY =
            Math.abs(ballVY);

    }


    if (
        ballY +
        BALL_SIZE / 2 >=
        HEIGHT
    ) {

        ballY =
            HEIGHT -
            BALL_SIZE / 2;

        ballVY =
            -Math.abs(ballVY);

    }


    if (
        ballVX < 0 &&
        ballX -
        BALL_SIZE / 2 <=
        PLAYER_X +
        PADDLE_WIDTH &&
        ballX +
        BALL_SIZE / 2 >=
        PLAYER_X &&
        ballY >=
        playerY &&
        ballY <=
        playerY +
        PADDLE_HEIGHT
    ) {

        ballX =
            PLAYER_X +
            PADDLE_WIDTH +
            BALL_SIZE / 2;

        bounceFromPaddle(
            playerY,
            true
        );

    }


    if (
        ballVX > 0 &&
        ballX +
        BALL_SIZE / 2 >=
        AI_X &&
        ballX -
        BALL_SIZE / 2 <=
        AI_X +
        PADDLE_WIDTH &&
        ballY >=
        aiY &&
        ballY <=
        aiY +
        PADDLE_HEIGHT
    ) {

        ballX =
            AI_X -
            BALL_SIZE / 2;

        bounceFromPaddle(
            aiY,
            false
        );

    }


    if (
        ballX < -40
    ) {

        aiScore++;

        checkScore();

    }


    if (
        ballX >
        WIDTH + 40
    ) {

        playerScore++;

        checkScore();

    }

}


/* =========================================================
   BOUNCE
========================================================= */

function bounceFromPaddle(
    paddleY,
    playerSide
) {

    const difficulty =
        getDifficulty();


    const relative =
        (
            ballY -
            (
                paddleY +
                PADDLE_HEIGHT / 2
            )
        ) /
        (
            PADDLE_HEIGHT / 2
        );


    ballSpeed =
        Math.min(
            ballSpeed * 1.045,
            difficulty.ballMaxSpeed
        );


    ballVY =
        relative *
        ballSpeed *
        0.82;


    const horizontal =
        Math.sqrt(
            Math.max(
                0,
                ballSpeed * ballSpeed -
                ballVY * ballVY
            )
        );


    ballVX =
        playerSide
            ? horizontal
            : -horizontal;

}


/* =========================================================
   SCORE CHECK
========================================================= */

function checkScore() {

    const target =
        roundTargets[
            save.currentRound - 1
        ];


    if (
        playerScore >= target
    ) {

        finishRound(true);
        return;

    }


    if (
        aiScore >= target
    ) {

        finishRound(false);
        return;

    }


    resetBall(
        playerScore > aiScore
            ? -1
            : 1
    );

}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound(
    playerWon
) {

    gameRunning = false;

    matchResult =
        playerWon
            ? "WIN"
            : "LOSS";


    if (
        playerWon
    ) {

        const cost =
            getRoundCost(
                save.difficulty,
                save.currentRound - 1
            );

        const winnings =
            getRoundWinning(
                save.difficulty,
                save.currentRound - 1
            );


        save.tokens +=
            winnings;

    }


    if (
        playerWon &&
        save.currentRound === 5
    ) {

        if (
            save.unlockedDifficulty < 2
        ) {

            save.unlockedDifficulty++;

        }

    }


    saveGame();

    resultSelection = 0;

    state = STATES.RESULT;

}


/* =========================================================
   RESULT
========================================================= */

function chooseResult() {

    if (
        resultSelection === 0
    ) {

        if (
            matchResult === "WIN" &&
            save.currentRound < 5
        ) {

            save.currentRound++;

            saveGame();

        }


        const cost =
            getRoundCost(
                save.difficulty,
                save.currentRound - 1
            );


        if (
            save.tokens < cost
        ) {

            state = STATES.TOKENS;
            return;

        }


        startRound(
            save.currentRound
        );

        return;

    }


    state = STATES.MENU;

}


/* =========================================================
   REDEMPTION
========================================================= */

function requestNewCode() {

    if (
        retryCount >=
        MAX_RETRIES
    ) {

        beginCooldown();
        return;

    }


    retryCount++;

    redemptionMessage =
        "New redemption attempt " +
        retryCount +
        " of " +
        MAX_RETRIES +
        ".";

}


function beginCooldown() {

    cooldownRemaining =
        COOLDOWN_SECONDS;

    cooldownLastUpdate =
        performance.now();

    state = STATES.COOLDOWN;

}


function updateCooldown(now) {

    if (
        state !== STATES.COOLDOWN
    ) {

        return;

    }


    if (
        cooldownLastUpdate === 0
    ) {

        cooldownLastUpdate = now;
        return;

    }


    const elapsed =
        (
            now -
            cooldownLastUpdate
        ) / 1000;


    cooldownLastUpdate =
        now;


    cooldownRemaining -=
        elapsed;


    if (
        cooldownRemaining <= 0
    ) {

        cooldownRemaining = 0;

        retryCount = 0;

        redemptionMessage =
            "Cooldown complete. You have 3 new attempts.";

        state = STATES.REDEEM;

    }

}


/* =========================================================
   REDEMPTION TEXT INPUT
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            state !== STATES.REDEEM
        ) {

            return;

        }


        if (
            event.key === "Backspace"
        ) {

            codeInput =
                codeInput.slice(
                    0,
                    -1
                );

            event.preventDefault();
            return;

        }


        if (
            event.key === "Enter"
        ) {

            attemptCodeB();

            event.preventDefault();
            return;

        }


        if (
            event.key.length === 1
        ) {

            if (
                codeInput.length < 300
            ) {

                codeInput +=
                    event.key.toUpperCase();

            }

            event.preventDefault();

        }

    }
);


function attemptCodeB() {

    if (
        codeInput.trim().length === 0
    ) {

        redemptionMessage =
            "Enter a Code B first.";

        return;

    }


    redemptionMessage =
        "Code B verification will be connected next.";

}


/* =========================================================
   DRAW HELPERS
========================================================= */

function clearScreen(
    color
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

}


function drawText(
    value,
    x,
    y,
    size,
    color,
    align = "center"
) {

    ctx.fillStyle =
        color;

    ctx.font =
        "bold " +
        size +
        "px Arial";

    ctx.textAlign =
        align;

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        value,
        x,
        y
    );

}


function drawPanel(
    x,
    y,
    width,
    height,
    fill,
    border
) {

    ctx.fillStyle =
        fill;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.strokeStyle =
        border;

    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );

}


/* =========================================================
   NORMAL MENU OPTION
========================================================= */

function drawMenuOption(
    label,
    y,
    selected
) {

    if (
        selected
    ) {

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            WIDTH / 2 - 210,
            y - 27,
            420,
            54
        );


        drawText(
            label,
            WIDTH / 2,
            y,
            24,
            "#111111"
        );

    } else {

        drawText(
            label,
            WIDTH / 2,
            y,
            24,
            "#ffffff"
        );

    }

}


/* =========================================================
   DIFFICULTY BOX
========================================================= */

function drawDifficultyBox(
    index,
    y
) {

    const difficulty =
        difficulties[index];

    const unlocked =
        index <=
        save.unlockedDifficulty;

    const selected =
        difficultySelection === index;


    let fill =
        difficulty.panel;

    let border =
        difficulty.border;

    let textColor =
        difficulty.primary;


    if (
        selected &&
        unlocked
    ) {

        fill =
            difficulty.primary;

        border =
            difficulty.primary;

        textColor =
            index === 0
                ? "#111111"
                : difficulty.background;

    }


    if (
        !unlocked
    ) {

        fill =
            "#141414";

        border =
            "#333333";

        textColor =
            "#555555";

    }


    drawPanel(
        WIDTH / 2 - 230,
        y - 32,
        460,
        64,
        fill,
        border
    );


    drawText(
        difficulty.name,
        WIDTH / 2,
        y,
        25,
        textColor
    );


    if (
        !unlocked
    ) {

        drawText(
            "LOCKED",
            WIDTH / 2 + 140,
            y,
            13,
            "#555555"
        );

    }

}


/* =========================================================
   MAIN MENU
========================================================= */

function drawMenu() {

    clearScreen(
        "#101010"
    );


    drawText(
        "PONG",
        WIDTH / 2,
        125,
        64,
        "#ffffff"
    );


    drawText(
        "TOKENS  " + save.tokens,
        WIDTH / 2,
        182,
        20,
        "#ffffff"

/* =========================================================
   ROUND MENU
========================================================= */

function drawRound() {

    clearScreen(
        "#101010"
    );


    drawText(
        "SELECT ROUND",
        WIDTH / 2,
        75,
        44,
        "#ffffff"
    );


    drawText(
        difficulties[
            save.difficulty
        ].name,
        WIDTH / 2,
        120,
        17,
        difficulties[
            save.difficulty
        ].primary
    );


    drawText(
        "TOKENS  " + save.tokens,
        WIDTH / 2,
        150,
        17,
        "#ffffff"
    );


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const round =
            i + 1;

        const cost =
            getRoundCost(
                save.difficulty,
                i
            );

        const target =
            roundTargets[i];

        const y =
            205 +
            i * 62;

        const affordable =
            save.tokens >= cost;

        const selected =
            roundSelection === i;


        let fill =
            affordable
                ? "#181818"
                : "#101010";

        let border =
            affordable
                ? "#444444"
                : "#252525";

        let colour =
            affordable
                ? "#ffffff"
                : "#555555";


        if (
            selected &&
            affordable
        ) {

            fill =
                difficulties[
                    save.difficulty
                ].primary;

            border =
                difficulties[
                    save.difficulty
                ].primary;

            colour =
                save.difficulty === 0
                    ? "#111111"
                    : difficulties[
                        save.difficulty
                    ].background;

        }


        drawPanel(
            WIDTH / 2 - 235,
            y - 24,
            470,
            48,
            fill,
            border
        );


        drawText(
            "ROUND " +
            round +
            "    " +
            cost +
            " → " +
            (
                getRoundWinning(
                    save.difficulty,
                    i
                )
            ) +
            " TOKENS",
            WIDTH / 2,
            y,
            18,
            colour
        );


        drawText(
            "FIRST TO " +
            target,
            WIDTH / 2 + 310,
            y,
            12,
            affordable
                ? "#888888"
                : "#444444"
        );

    }


    drawText(
        "ESC BACK",
        WIDTH / 2,
        550,
        13,
        "#555555"
    );

}


/* =========================================================
   GAME
========================================================= */

function drawGame() {

    const difficulty =
        getDifficulty();


    clearScreen(
        difficulty.background
    );


    /*
       Top round indicator
    */

    drawText(
        "ROUND " +
        save.currentRound +
        "/5",
        WIDTH / 2,
        25,
        18,
        difficulty.primary
    );


    /*
       Centre line
    */

    ctx.strokeStyle =
        difficulty.secondary;

    ctx.lineWidth = 2;

    ctx.setLineDash([
        12,
        14
    ]);

    ctx.beginPath();

    ctx.moveTo(
        WIDTH / 2,
        0
    );

    ctx.lineTo(
        WIDTH / 2,
        HEIGHT
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /*
       Outer border
    */

    ctx.strokeStyle =
        difficulty.border;

    ctx.strokeRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
       Score
    */

    const target =
        roundTargets[
            save.currentRound - 1
        ];


    drawText(
        playerScore +
        "/" +
        target,
        WIDTH / 2 - 90,
        70,
        40,
        difficulty.primary
    );


    drawText(
        aiScore +
        "/" +
        target,
        WIDTH / 2 + 90,
        70,
        40,
        difficulty.primary
    );


    /*
       Paddles
    */

    ctx.fillStyle =
        difficulty.primary;


    ctx.fillRect(
        PLAYER_X,
        playerY,
        PADDLE_WIDTH,
        PADDLE_HEIGHT
    );


    ctx.fillRect(
        AI_X,
        aiY,
        PADDLE_WIDTH,
        PADDLE_HEIGHT
    );


    /*
       Ball
    */

    ctx.fillRect(
        ballX -
        BALL_SIZE / 2,
        ballY -
        BALL_SIZE / 2,
        BALL_SIZE,
        BALL_SIZE
    );


    /*
       Tokens
    */

    drawText(
        "TOKENS " +
        save.tokens,
        20,
        22,
        15,
        difficulty.primary,
        "left"
    );


    /*
       Bottom
    */

    drawText(
        "W / S or ↑ / ↓     SPACE PAUSE",
        WIDTH / 2,
        HEIGHT - 22,
        13,
        difficulty.muted
    );


    /*
       Pause overlay
    */

    if (
        state === STATES.PAUSED
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,0.70)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        drawText(
            "PAUSED",
            WIDTH / 2,
            HEIGHT / 2,
            48,
            difficulty.primary
        );


        drawText(
            "SPACE TO RESUME",
            WIDTH / 2,
            HEIGHT / 2 + 55,
            16,
            difficulty.primary
        );

    }

}


/* =========================================================
   RESULT
========================================================= */

function drawResult() {

    const difficulty =
        getDifficulty();


    clearScreen(
        "#101010"
    );


    const won =
        matchResult === "WIN";


    drawText(
        won
            ? "ROUND COMPLETE"
            : "ROUND LOST",
        WIDTH / 2,
        115,
        42,
        won
            ? difficulty.primary
            : "#ffffff"
    );


    const target =
        roundTargets[
            save.currentRound - 1
        ];


    drawText(
        playerScore +
        "/" +
        target +
        "  -  " +
        aiScore +
        "/" +
        target,
        WIDTH / 2,
        180,
        38,
        "#ffffff"
    );


    if (
        won
    ) {

        const winnings =
            getRoundWinning(
                save.difficulty,
                save.currentRound - 1
            );


        drawText(
            "+" +
            winnings +
            " TOKENS",
            WIDTH / 2,
            235,
            20,
            difficulty.primary
        );

    }


    if (
        won &&
        save.currentRound === 5
    ) {

        if (
            save.difficulty < 2
        ) {

            drawText(
                difficulties[
                    save.difficulty + 1
                ].name +
                " UNLOCKED",
                WIDTH / 2,
                280,
                20,
                difficulties[
                    save.difficulty + 1
                ].primary
            );

        } else {

            drawText(
                "ALL DIFFICULTIES COMPLETE",
                WIDTH / 2,
                280,
                18,
                difficulty.primary
            );

        }

    }


    if (
        won &&
        save.currentRound < 5
    ) {

        drawMenuOption(
            "NEXT ROUND",
            365,
            resultSelection === 0
        );

    } else {

        drawMenuOption(
            "PLAY AGAIN",
            365,
            resultSelection === 0
        );

    }


    drawMenuOption(
        "MAIN MENU",
        435,
        resultSelection === 1
    );


    drawText(
        "W / S or ↑ / ↓",
        WIDTH / 2,
        510,
        14,
        "#666666"
    );

}

/* =========================================================

========================================================= */

function drawCooldown() {

    clearScreen(

    drawText(

        WIDTH / 2,
        150,

    );

        Math.ceil(

    const timer =

    );

/* =========================================================
   DRAW
========================================================= */

function draw() {

    if (
        state === STATES.MENU
    ) {

        drawMenu();
        return;

    }


    if (
        state === STATES.DIFFICULTY
    ) {

        drawDifficulty();
        return;

    }


    if (
        state === STATES.ROUND
    ) {

        drawRound();
        return;

    }


    if (
        state === STATES.PLAYING ||
        state === STATES.PAUSED
    ) {

        drawGame();
        return;

    }


    if (
        state === STATES.RESULT
    ) {

        drawResult();
        return;

    }


    if (
        state === STATES.TOKENS
    ) {

        drawTokens();
        return;

    }


    if (
        state === STATES.REDEEM
    ) {

        drawRedeem();
        return;

    }


    if (
        state === STATES.COOLDOWN
    ) {

        drawCooldown();
        return;

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (
        state === STATES.PLAYING
    ) {

        updatePlayer(dt);
        updateAI(dt);
        updateBall(dt);

    }

}


/* =========================================================
   MENU INPUT
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key;


        if (
            state === STATES.MENU
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                menuMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                menuMove(1);

            }

            return;

        }


        if (
            state === STATES.DIFFICULTY
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                difficultyMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                difficultyMove(1);

            }

            return;

        }


        if (
            state === STATES.ROUND
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                roundMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                roundMove(1);

            }

            return;

        }


        if (
            state === STATES.RESULT
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                resultMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                resultMove(1);

            }

            return;

        }


        if (
            state === STATES.TOKENS
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                tokenMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                tokenMove(1);

            }

            return;

        }


        if (
            state === STATES.REDEEM
        ) {

            if (
                key === "F1"
            ) {

                requestNewCode();

            }

        }

    }
);


/* =========================================================
   LOOP
========================================================= */

let previousTime =
    performance.now();


function loop(now) {

    let dt =
        (
            now -
            previousTime
        ) / 1000;


    previousTime =
        now;


    if (
        dt > 0.033
    ) {

        dt = 0.033;

    }


    update(dt);

    updateCooldown(now);

    draw();


    requestAnimationFrame(
        loop
    );

}


draw();

requestAnimationFrame(
    loop
);

</script>
