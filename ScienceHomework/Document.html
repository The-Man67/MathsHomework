const SAVE_KEY =

function defaultSave() {

    return {
        tokens: 10,
        difficulty: 0,
        unlockedDifficulty: 0,
        currentRound: 1
    };

}


let save;


function loadSave() {

    try {

        const raw =
            localStorage.getItem(
                SAVE_KEY
            );


        if (!raw) {

            save =
                defaultSave();

            saveGame();

            return;

        }


        const parsed =
            JSON.parse(raw);


        save =
            defaultSave();


        if (
            Number.isFinite(
                parsed.tokens
            )
        ) {

            save.tokens =
                Math.max(
                    0,
                    Math.floor(
                        parsed.tokens
                    )
                );

        }


        if (
            Number.isFinite(
                parsed.difficulty
            )
        ) {

            save.difficulty =
                Math.max(
                    0,
                    Math.min(
                        2,
                        Math.floor(
                            parsed.difficulty
                        )
                    )
                );

        }


        if (
            Number.isFinite(
                parsed.unlockedDifficulty
            )
        ) {

            save.unlockedDifficulty =
                Math.max(
                    0,
                    Math.min(
                        2,
                        Math.floor(
                            parsed.unlockedDifficulty
                        )
                    )
                );

        }


        if (
            Number.isFinite(
                parsed.currentRound
            )
        ) {

            save.currentRound =
                Math.max(
                    1,
                    Math.min(
                        5,
                        Math.floor(
                            parsed.currentRound
                        )
                    )
                );

        }


        if (
            save.difficulty >
            save.unlockedDifficulty
        ) {

            save.difficulty =
                save.unlockedDifficulty;

        }

    } catch (error) {

        save =
            defaultSave();

    }

}


function saveGame() {

    try {

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(
                save
            )
        );

    } catch (error) {

    }

}

function isValidCodeString(
    value,
    length
) {

    if (
        typeof value !==
        "string"
    ) {

        return false;

    }


    if (
        value.length !==
        length
    ) {

        return false;

    }


    for (
        const character of value
    ) {

        if (
            !CODE_ALPHABET.includes(
                character
            )
        ) {

            return false;

        }

    }


    return true;

}


function randomCodeString(
    length
) {

    let result = "";


    try {

        if (
            window.crypto &&
            window.crypto.getRandomValues
        ) {

            const values =
                new Uint32Array(
                    length
                );


            window.crypto.getRandomValues(
                values
            );


            for (
                let i = 0;
                i < length;
                i++
            ) {

                result +=
                    CODE_ALPHABET[
                        values[i] %
                        CODE_ALPHABET.length
                    ];

            }


            return result;

        }

    } catch (error) {

    }


    for (
        let i = 0;
        i < length;
        i++
    ) {

        result +=
            CODE_ALPHABET[
                Math.floor(
                    Math.random() *
                    CODE_ALPHABET.length
                )
            ];

    }


    return result;

}

}

const SHA256_K = [

];


function rightRotate(
    value,
    amount
) {

    return (
        value >>> amount
    ) |
    (
        value <<
        (
            32 - amount
        )
    );

}


function sha256Sync(
    input
) {

    const bytes =
        new TextEncoder().encode(
            input
        );


    const bitLength =
        bytes.length *
        8;


    const paddedLength =
        (
            Math.ceil(
                (
                    bytes.length +
                    9
                ) / 64
            )
        ) *
        64;


    const message =
        new Uint8Array(
            paddedLength
        );


    message.set(
        bytes
    );


    message[
        bytes.length
    ] =
        0x80;


    const highBits =
        Math.floor(
            bitLength /
            0x100000000
        );


    const lowBits =
        bitLength >>> 0;


    message[
        paddedLength - 8
    ] =
        (
            highBits >>> 24
        ) &
        0xff;


    message[
        paddedLength - 7
    ] =
        (
            highBits >>> 16
        ) &
        0xff;


    message[
        paddedLength - 6
    ] =
        (
            highBits >>> 8
        ) &
        0xff;


    message[
        paddedLength - 5
    ] =
        highBits &
        0xff;


    message[
        paddedLength - 4
    ] =
        (
            lowBits >>> 24
        ) &
        0xff;


    message[
        paddedLength - 3
    ] =
        (
            lowBits >>> 16
        ) &
        0xff;


    message[
        paddedLength - 2
    ] =
        (
            lowBits >>> 8
        ) &
        0xff;


    message[
        paddedLength - 1
    ] =
        lowBits &
        0xff;


    let h0 =
        0x6a09e667;

    let h1 =
        0xbb67ae85;

    let h2 =
        0x3c6ef372;

    let h3 =
        0xa54ff53a;

    let h4 =
        0x510e527f;

    let h5 =
        0x9b05688c;

    let h6 =
        0x1f83d9ab;

    let h7 =
        0x5be0cd19;


    const words =
        new Uint32Array(
            64
        );


    for (
        let offset = 0;
        offset < paddedLength;
        offset += 64
    ) {

        for (
            let i = 0;
            i < 16;
            i++
        ) {

            const position =
                offset +
                i * 4;


            words[i] =
                (
                    message[position]
                    << 24
                ) |
                (
                    message[position + 1]
                    << 16
                ) |
                (
                    message[position + 2]
                    << 8
                ) |
                (
                    message[position + 3]
                );

        }


        for (
            let i = 16;
            i < 64;
            i++
        ) {

            const s0 =
                rightRotate(
                    words[i - 15],
                    7
                ) ^
                rightRotate(
                    words[i - 15],
                    18
                ) ^
                (
                    words[i - 15] >>> 3
                );


            const s1 =
                rightRotate(
                    words[i - 2],
                    17
                ) ^
                rightRotate(
                    words[i - 2],
                    19
                ) ^
                (
                    words[i - 2] >>> 10
                );


            words[i] =
                (
                    words[i - 16] +
                    s0 +
                    words[i - 7] +
                    s1
                ) >>> 0;

        }


        let a = h0;
        let b = h1;
        let c = h2;
        let d = h3;
        let e = h4;
        let f = h5;
        let g = h6;
        let h = h7;


        for (
            let i = 0;
            i < 64;
            i++
        ) {

            const S1 =
                rightRotate(
                    e,
                    6
                ) ^
                rightRotate(
                    e,
                    11
                ) ^
                rightRotate(
                    e,
                    25
                );


            const ch =
                (
                    e & f
                ) ^
                (
                    (~e) & g
                );


            const temp1 =
                (
                    h +
                    S1 +
                    ch +
                    SHA256_K[i] +
                    words[i]
                ) >>> 0;


            const S0 =
                rightRotate(
                    a,
                    2
                ) ^
                rightRotate(
                    a,
                    13
                ) ^
                rightRotate(
                    a,
                    22
                );


            const maj =
                (
                    a & b
                ) ^
                (
                    a & c
                ) ^
                (
                    b & c
                );


            const temp2 =
                (
                    S0 +
                    maj
                ) >>> 0;


            h = g;
            g = f;
            f = e;

            e =
                (
                    d +
                    temp1
                ) >>> 0;

            d = c;
            c = b;
            b = a;

            a =
                (
                    temp1 +
                    temp2
                ) >>> 0;

        }


        h0 =
            (
                h0 +
                a
            ) >>> 0;


        h1 =
            (
                h1 +
                b
            ) >>> 0;


        h2 =
            (
                h2 +
                c
            ) >>> 0;


        h3 =
            (
                h3 +
                d
            ) >>> 0;


        h4 =
            (
                h4 +
                e
            ) >>> 0;


        h5 =
            (
                h5 +
                f
            ) >>> 0;


        h6 =
            (
                h6 +
                g
            ) >>> 0;


        h7 =
            (
                h7 +
                h
            ) >>> 0;

    }


    const output = [

        h0,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        h7

    ];


    let result = "";


    for (
        const value of output
    ) {

        result +=
            value
                .toString(16)
                .padStart(
                    8,
                    "0"
                );

    }


    return result;

}


async function sha256(
    input
) {

    try {

        if (
            window.crypto &&
            window.crypto.subtle
        ) {

            const data =
                new TextEncoder().encode(
                    input
                );


            const hash =
                await window.crypto.subtle.digest(
                    "SHA-256",
                    data
                );


            const bytes =
                new Uint8Array(
                    hash
                );


            let result = "";


            for (
                const byte of bytes
            ) {

                result +=
                    byte
                        .toString(16)
                        .padStart(
                            2,
                            "0"
                        );

            }


            return result;

        }

    } catch (error) {

    }


    return sha256Sync(
        input
    );

}


/* =========================================================
   CODE EQUATION
========================================================= */

function characterValue(
    character
) {

    const index =
        CODE_ALPHABET.indexOf(
            character
        );


    if (
        index < 0
    ) {

        return -1;

    }


    return index + 11;

}


function calculateEquation(
    value
) {

    const values = [];


    for (
        const character of value
    ) {

        const number =
            characterValue(
                character
            );


        if (
            number < 0
        ) {

            return null;

        }


        values.push(
            number
        );

    }


    if (
        values.length < 16
    ) {

        return null;

    }


    let a =
        values[0] *
        values[2];


    let b =
        values[1] +
        values[3];


    let c =
        values[4] *
        7;


    let d =
        values[5] +
        values[6];


    let e =
        (
            a +
            b
        ) *
        c;


    let f =
        e +
        d;


    let g =
        f *
        values[7];


    let h =
        g +
        values[8];


    let i =
        h *
        values[9];


    let j =
        i +
        values[10];


    let k =
        (
            j *
            values[11]
        ) +
        (
            j ^
            values[11]
        );


    k =
        Math.abs(
            k %
            1000000007
        );


    let l =
        k +
        values[12];


    let m =
        l *
        values[13];


    let n =
        m +
        values[14];


    let result =
        n *
        values[15];


    result =
        Math.abs(
            result %
            1000000007
        );


    return result;

}


/* =========================================================
   CODE A
========================================================= */

let currentCodeA = "";

let currentRedemptionId = "";

let codeAGenerating = false;


async function createCodeA() {

    if (
        codeAGenerating
    ) {

        return;

    }


    codeAGenerating = true;

    currentCodeA = "";
    currentRedemptionId = "";


    try {

        currentRedemptionId =
            randomCodeString(
                REDEMPTION_ID_LENGTH
            );


        const combined =
            installationId +
            currentRedemptionId;


        const equation =
            calculateEquation(
                combined
            );


        if (
            equation === null
        ) {

            throw new Error(
                "Equation generation failed"
            );

        }


        const checksumInput =
            installationId +
            "|" +
            currentRedemptionId +
            "|" +
            equation;


        const hash =
            await sha256(
                checksumInput
            );


        const checksum =
            hash
                .slice(
                    0,
                    16
                )
                .toUpperCase();


        currentCodeA =
            CODE_A_PREFIX +
            "-" +
            installationId +
            "-" +
            currentRedemptionId +
            "-" +
            checksum;


        redemptionMessage =
            "Redemption code ready.";

    } catch (error) {

        currentCodeA = "";

        currentRedemptionId = "";

        redemptionMessage =
            "Unable to generate redemption code.";

    }


    codeAGenerating = false;

}


createCodeA();


/* =========================================================
   COPY
========================================================= */

async function copyText(
    value
) {

    if (
        !value
    ) {

        return false;

    }


    try {

        if (
            navigator.clipboard &&
            navigator.clipboard.writeText
        ) {

            await navigator.clipboard.writeText(
                value
            );

            return true;

        }

    } catch (error) {

    }


    try {

        const area =
            document.createElement(
                "textarea"
            );


        area.value =
            value;


        area.style.position =
            "fixed";

        area.style.left =
            "-9999px";


        document.body.appendChild(
            area
        );


        area.focus();

        area.select();


        const successful =
            document.execCommand(
                "copy"
            );


        document.body.removeChild(
            area
        );


        return successful;

    } catch (error) {

        return false;

    }

}


async function copyCurrentCodeA() {

    if (
        !currentCodeA
    ) {

        redemptionMessage =
            "There is no redemption code to copy.";

        return;

    }


    const copied =
        await copyText(
            currentCodeA
        );


    redemptionMessage =
        copied
            ? "Redemption code copied."
            : "Copy failed. You can copy it manually.";

}


/* =========================================================
   REDEMPTION
========================================================= */

async function requestNewCode() {

    if (
        cooldownActive
    ) {

        state =
            STATES.COOLDOWN;

        return;

    }


    if (
        retryCount >=
        MAX_RETRIES
    ) {

        beginCooldown();

        return;

    }


    retryCount++;


    await createCodeA();


    redemptionMessage =
        "New redemption code generated. Attempt " +
        retryCount +
        " of " +
        MAX_RETRIES + ".";

}


/* =========================================================
   COOLDOWN
========================================================= */

function beginCooldown() {

    cooldownActive = true;

    cooldownRemaining =
        COOLDOWN_SECONDS;

    cooldownLastUpdate =
        performance.now();

    state =
        STATES.COOLDOWN;

}


function updateCooldown(
    now
) {

    if (
        !cooldownActive
    ) {

        return;

    }


    if (
        cooldownLastUpdate === 0
    ) {

        cooldownLastUpdate =
            now;

        return;

    }


    const elapsed =
        (
            now -
            cooldownLastUpdate
        ) / 1000;


    cooldownLastUpdate =
        now;


    cooldownRemaining -=
        elapsed;


    if (
        cooldownRemaining <= 0
    ) {

        cooldownRemaining =
            0;


        cooldownActive =
            false;


        retryCount =
            0;


        redemptionMessage =
            "Cooldown complete. You have 3 new attempts.";


        createCodeA();

    }

}


/* =========================================================
   DIFFICULTY / ROUND / MENU
========================================================= */

function getDifficulty() {

    return difficulties[
        save.difficulty
    ];

}


function getRoundCost(
    difficultyIndex,
    roundIndex
) {

    const multiplier =
        difficultyIndex === 0
            ? 1
            : difficultyIndex === 1
                ? 2
                : 5;


    return (
        slowRoundCosts[
            roundIndex
        ] *
        multiplier
    );

}


function getRoundWinning(
    difficultyIndex,
    roundIndex
) {

    return (
        getRoundCost(
            difficultyIndex,
            roundIndex
        ) *
        2
    );

}


function menuMove(
    direction
) {

    menuSelection +=
        direction;


    if (
        menuSelection < 0
    ) {

        menuSelection = 1;

    }


    if (
        menuSelection > 1
    ) {

        menuSelection = 0;

    }

}


function difficultyMove(
    direction
) {

    difficultySelection +=
        direction;


    if (
        difficultySelection < 0
    ) {

        difficultySelection = 0;

    }


    if (
        difficultySelection >
        save.unlockedDifficulty
    ) {

        difficultySelection =
            save.unlockedDifficulty;

    }


    if (
        difficultySelection > 2
    ) {

        difficultySelection = 2;

    }

}


function roundMove(
    direction
) {

    roundSelection +=
        direction;


    if (
        roundSelection < 0
    ) {

        roundSelection = 0;

    }


    if (
        roundSelection > 4
    ) {

        roundSelection = 4;

    }

}


function resultMove(
    direction
) {

    resultSelection +=
        direction;


    if (
        resultSelection < 0
    ) {

        resultSelection = 1;

    }


    if (
        resultSelection > 1
    ) {

        resultSelection = 0;

    }

}


function tokenMove(
    direction
) {

    tokenSelection +=
        direction;


    if (
        tokenSelection < 0
    ) {

        tokenSelection = 1;

    }


    if (
        tokenSelection > 1
    ) {

        tokenSelection = 0;

    }

}


function redeemMove(
    direction
) {

    redeemSelection +=
        direction;


    if (
        redeemSelection < 0
    ) {

        redeemSelection = 3;

    }


    if (
        redeemSelection > 3
    ) {

        redeemSelection = 0;

    }

}


/* =========================================================
   ENTER
========================================================= */

function handleEnter(
    event
) {

    if (
        event.key !== "Enter"
    ) {

        return;

    }


    if (
        state === STATES.MENU
    ) {

        if (
            menuSelection === 0
        ) {

            state =
                STATES.DIFFICULTY;

        } else {

            state =
                STATES.TOKENS;

        }

        return;

    }


    if (
        state === STATES.DIFFICULTY
    ) {

        save.difficulty =
            difficultySelection;


        saveGame();


        roundSelection =
            save.currentRound - 1;


        state =
            STATES.ROUND;

        return;

    }


    if (
        state === STATES.ROUND
    ) {

        chooseRound();

        return;

    }


    if (
        state === STATES.RESULT
    ) {

        chooseResult();

        return;

    }


    if (
        state === STATES.TOKENS
    ) {

        if (
            tokenSelection === 0
        ) {

            state =
                STATES.REDEEM;


            redeemSelection =
                0;


            focusClipboardInput();

        } else {

            state =
                STATES.MENU;

        }

        return;

    }


    if (
        state === STATES.REDEEM
    ) {

        if (
            redeemSelection === 0
        ) {

            copyCurrentCodeA();

        } else if (
            redeemSelection === 1
        ) {

            requestNewCode();

        } else if (
            redeemSelection === 2
        ) {

            attemptCode();

        } else {

            state =
                STATES.TOKENS;

        }

        return;

    }

}


/* =========================================================
   ESCAPE
========================================================= */

function handleEscape() {

    if (
        state === STATES.PLAYING
    ) {

        paused = true;

        state =
            STATES.PAUSED;

        return;

    }


    if (
        state === STATES.PAUSED
    ) {

        paused = false;

        state =
            STATES.PLAYING;

        return;

    }


    if (
        state === STATES.DIFFICULTY ||
        state === STATES.TOKENS
    ) {

        state =
            STATES.MENU;

        return;

    }


    if (
        state === STATES.ROUND
    ) {

        state =
            STATES.DIFFICULTY;

        return;

    }


    if (
        state === STATES.RESULT
    ) {

        state =
            STATES.ROUND;

        return;

    }


    if (
        state === STATES.REDEEM ||
        state === STATES.COOLDOWN
    ) {

        state =
            STATES.TOKENS;

        return;

    }

}


/* =========================================================
   ROUND
========================================================= */

function chooseRound() {

    const selectedRound =
        roundSelection + 1;


    const cost =
        getRoundCost(
            save.difficulty,
            roundSelection
        );


    if (
        save.tokens < cost
    ) {

        redemptionMessage =
            "You need " +
            cost +
            " tokens to play this round.";


        state =
            STATES.TOKENS;


        return;

    }


    save.currentRound =
        selectedRound;


    saveGame();


    startRound(
        selectedRound
    );

}


/* =========================================================
   START ROUND
========================================================= */

function startRound(
    roundNumber
) {

    const roundIndex =
        roundNumber - 1;


    const cost =
        getRoundCost(
            save.difficulty,
            roundIndex
        );


    if (
        save.tokens < cost
    ) {

        state =
            STATES.TOKENS;

        return;

    }


    save.tokens -=
        cost;


    saveGame();


    playerScore = 0;

    aiScore = 0;


    playerY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;


    aiY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;


    paused = false;

    gameRunning = true;

    matchResult = "";


    resetBall(
        Math.random() < 0.5
            ? -1
            : 1
    );


    state =
        STATES.PLAYING;

}


/* =========================================================
   BALL RESET
========================================================= */

function resetBall(
    direction
) {

    const difficulty =
        getDifficulty();


    const roundMultiplier =
        1 +
        (
            save.currentRound - 1
        ) *
        0.08;


    ballX =
        WIDTH / 2;


    ballY =
        HEIGHT / 2;


    ballSpeed =
        Math.min(
            difficulty.ballStartSpeed *
            roundMultiplier,
            difficulty.ballMaxSpeed
        );


    const angle =
        Math.random() *
        0.75 -
        0.375;


    ballVX =
        ballSpeed *
        direction;


    ballVY =
        ballSpeed *
        angle;

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(
    dt
) {

    let movement = 0;


    if (
        keys["w"] ||
        keys["W"] ||
        keys["ArrowUp"]
    ) {

        movement -= 1;

    }


    if (
        keys["s"] ||
        keys["S"] ||
        keys["ArrowDown"]
    ) {

        movement += 1;

    }


    playerY +=
        movement *
        540 *
        dt;


    if (
        playerY < 0
    ) {

        playerY = 0;

    }


    if (
        playerY >
        HEIGHT -
        PADDLE_HEIGHT
    ) {

        playerY =
            HEIGHT -
            PADDLE_HEIGHT;

    }

}


/* =========================================================
   AI
========================================================= */

function updateAI(
    dt
) {

    const difficulty =
        getDifficulty();


    const target =
        ballY -
        PADDLE_HEIGHT / 2;


    const roundMultiplier =
        1 +
        (
            save.currentRound - 1
        ) *
        0.035;


    const speed =
        difficulty.aiSpeed *
        roundMultiplier;


    if (
        aiY < target
    ) {

        aiY +=
            speed *
            dt;

    }


    if (
        aiY > target
    ) {

        aiY -=
            speed *
            dt;

    }


    if (
        aiY < 0
    ) {

        aiY = 0;

    }


    if (
        aiY >
        HEIGHT -
        PADDLE_HEIGHT
    ) {

        aiY =
            HEIGHT -
            PADDLE_HEIGHT;

    }

}


/* =========================================================
   BALL
========================================================= */

function updateBall(
    dt
) {

    ballX +=
        ballVX *
        dt;


    ballY +=
        ballVY *
        dt;


    if (
        ballY -
        BALL_SIZE / 2 <=
        0
    ) {

        ballY =
            BALL_SIZE / 2;


        ballVY =
            Math.abs(
                ballVY
            );

    }


    if (
        ballY +
        BALL_SIZE / 2 >=
        HEIGHT
    ) {

        ballY =
            HEIGHT -
            BALL_SIZE / 2;


        ballVY =
            -Math.abs(
                ballVY
            );

    }


    if (
        ballVX < 0 &&
        ballX -
        BALL_SIZE / 2 <=
        PLAYER_X +
        PADDLE_WIDTH &&
        ballX +
        BALL_SIZE / 2 >=
        PLAYER_X &&
        ballY >=
        playerY &&
        ballY <=
        playerY +
        PADDLE_HEIGHT
    ) {

        ballX =
            PLAYER_X +
            PADDLE_WIDTH +
            BALL_SIZE / 2;


        bounceFromPaddle(
            playerY,
            true
        );

    }


    if (
        ballVX > 0 &&
        ballX +
        BALL_SIZE / 2 >=
        AI_X &&
        ballX -
        BALL_SIZE / 2 <=
        AI_X +
        PADDLE_WIDTH &&
        ballY >=
        aiY &&
        ballY <=
        aiY +
        PADDLE_HEIGHT
    ) {

        ballX =
            AI_X -
            BALL_SIZE / 2;


        bounceFromPaddle(
            aiY,
            false
        );

    }


    if (
        ballX < -40
    ) {

        aiScore++;

        checkScore();

    }


    if (
        ballX >
        WIDTH + 40
    ) {

        playerScore++;

        checkScore();

    }

}


/* =========================================================
   BOUNCE
========================================================= */

function bounceFromPaddle(
    paddleY,
    playerSide
) {

    const difficulty =
        getDifficulty();


    const relative =
        (
            ballY -
            (
                paddleY +
                PADDLE_HEIGHT / 2
            )
        ) /
        (
            PADDLE_HEIGHT / 2
        );


    ballSpeed =
        Math.min(
            ballSpeed * 1.045,
            difficulty.ballMaxSpeed
        );


    ballVY =
        relative *
        ballSpeed *
        0.82;


    const horizontal =
        Math.sqrt(
            Math.max(
                0,
                ballSpeed *
                ballSpeed -
                ballVY *
                ballVY
            )
        );


    ballVX =
        playerSide
            ? horizontal
            : -horizontal;

}


/* =========================================================
   SCORE
========================================================= */

function checkScore() {

    const target =
        roundTargets[
            save.currentRound - 1
        ];


    if (
        playerScore >= target
    ) {

        finishRound(true);

        return;

    }


    if (
        aiScore >= target
    ) {

        finishRound(false);

        return;

    }


    resetBall(
        playerScore > aiScore
            ? -1
            : 1
    );

}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound(
    playerWon
) {

    gameRunning = false;


    matchResult =
        playerWon
            ? "WIN"
            : "LOSS";


    if (
        playerWon
    ) {

        const winnings =
            getRoundWinning(
                save.difficulty,
                save.currentRound - 1
            );


        save.tokens +=
            winnings;

    }


    if (
        playerWon &&
        save.currentRound === 5
    ) {

        if (
            save.unlockedDifficulty < 2
        ) {

            save.unlockedDifficulty++;

        }

    }


    saveGame();


    resultSelection = 0;


    state =
        STATES.RESULT;

}


/* =========================================================
   RESULT
========================================================= */

function chooseResult() {

    if (
        resultSelection === 0
    ) {

        if (
            matchResult === "WIN" &&
            save.currentRound < 5
        ) {

            save.currentRound++;

            saveGame();

        }


        const cost =
            getRoundCost(
                save.difficulty,
                save.currentRound - 1
            );


        if (
            save.tokens < cost
        ) {

            state =
                STATES.TOKENS;

            return;

        }


        startRound(
            save.currentRound
        );


        return;

    }


    state =
        STATES.MENU;

}


/* =========================================================
   CODE REDEMPTION
========================================================= */

function attemptCode() {

    if (
        codeInput
            .trim()
            .length === 0
    ) {

        redemptionMessage =
            "Enter a token code first.";

        focusClipboardInput();

        return;

    }


    /*
       Real Ed25519 verification and token awarding
       will be connected after the genuine Worker
       public key has been generated and tested.
    */

    redemptionMessage =
        "Token code received. Verification is not connected yet.";

    focusClipboardInput();

}

) {

    );

) {

    ctx.lineWidth = 2;

        width,
        height
    );

}

        "#ffffff"
    );

                WIDTH / 2,
                280,

                    save.difficulty + 1
                ].primary
            );

        } else {

            drawText(
                "ALL DIFFICULTIES COMPLETE",
                WIDTH / 2,

                18,
                difficulty.primary
            );

    if (
        won &&

    ) {

            "NEXT ROUND",

            resultSelection === 0
        );

    } else {

        drawMenuOption(
            "PLAY AGAIN",
            365,
            resultSelection === 0

    }

        435,
        resultSelection === 1
    );

        510,

        "#666666"
    );

}

function drawRedeem() {

    );

        "TOKENS  " +

        17,

    );


    /*

    */

    drawText(
        "REDEMPTION CODE",
        WIDTH / 2,
        135,
        16,
        "#aaaaaa"
    );

        45,
        155,
        870,
        88,
        "#181818",
        "#555555"
    );


    let displayCode =

    );

    */

        "TOKEN CODE",

    );

        295,
        870,
        88,

        "#555555"
    );


    ctx.fillStyle =

/* =========================================================
   DRAW
========================================================= */

function draw() {

    if (
        state === STATES.MENU
    ) {

        drawMenu();
        return;

    }


    if (
        state === STATES.DIFFICULTY
    ) {

        drawDifficulty();
        return;

    }


    if (
        state === STATES.ROUND
    ) {

        drawRound();
        return;

    }


    if (
        state === STATES.PLAYING ||
        state === STATES.PAUSED
    ) {

        drawGame();
        return;

    }


    if (
        state === STATES.RESULT
    ) {

        drawResult();
        return;

    }


    if (
        state === STATES.TOKENS
    ) {

        drawTokens();
        return;

    }


    if (
        state === STATES.REDEEM
    ) {

        drawRedeem();
        return;

    }


    if (
        state === STATES.COOLDOWN
    ) {

        drawCooldown();
        return;

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.key
        ] = true;


        /*
           Ctrl+C
        */

        if (
            state === STATES.REDEEM &&
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            (
                event.key === "c" ||
                event.key === "C"
            )
        ) {

            event.preventDefault();

            copyCurrentCodeA();

            return;

        }


        /*
           Ctrl+V
        */

        if (
            state === STATES.REDEEM &&
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            (
                event.key === "v" ||
                event.key === "V"
            )
        ) {

            /*
               Try to read directly first.
               If the browser refuses clipboard
               read access, the hidden textarea
               will receive the normal paste event.
            */

            if (
                navigator.clipboard &&
                navigator.clipboard.readText
            ) {

                navigator.clipboard.readText()
                    .then(
                        function(value) {

                            if (
                                typeof value ===
                                "string"
                            ) {

                                codeInput =
                                    value
                                        .replace(
                                            /\s+/g,
                                            ""
                                        )
                                        .toUpperCase();


                                clipboardInput.value =
                                    codeInput;


                                redemptionMessage =
                                    "Token code pasted.";

                            }

                        }
                    )
                    .catch(
                        function() {

                            focusClipboardInput();

                        }
                    );

            }


            focusClipboardInput();

            return;

        }


        /*
           Redemption text input
        */

        if (
            state === STATES.REDEEM
        ) {

            if (
                event.key === "Backspace"
            ) {

                codeInput =
                    codeInput.slice(
                        0,
                        -1
                    );


                clipboardInput.value =
                    codeInput;


                event.preventDefault();

                return;

            }


            if (
                event.key === "Enter"
            ) {

                handleEnter(event);

                event.preventDefault();

                return;

            }


            if (
                event.key.length === 1 &&
                !event.ctrlKey &&
                !event.metaKey
            ) {

                codeInput +=
                    event.key.toUpperCase();


                clipboardInput.value =
                    codeInput;


                event.preventDefault();

                return;

            }

        }


        /*
           Space pause
        */

        if (
            event.key === " " ||
            event.code === "Space"
        ) {

            event.preventDefault();


            if (
                state === STATES.PLAYING
            ) {

                paused = true;

                state =
                    STATES.PAUSED;

            } else if (
                state === STATES.PAUSED
            ) {

                paused = false;

                state =
                    STATES.PLAYING;

            }


            return;

        }


        /*
           Escape
        */

        if (
            event.key === "Escape"
        ) {

            handleEscape();

            return;

        }


        handleEnter(event);

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key
        ] = false;

    }
);


/* =========================================================
   NAVIGATION
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key;


        if (
            state === STATES.MENU
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                menuMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                menuMove(1);

            }


            return;

        }


        if (
            state === STATES.DIFFICULTY
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                difficultyMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                difficultyMove(1);

            }


            return;

        }


        if (
            state === STATES.ROUND
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                roundMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                roundMove(1);

            }


            return;

        }


        if (
            state === STATES.RESULT
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                resultMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                resultMove(1);

            }


            return;

        }


        if (
            state === STATES.TOKENS
        ) {

            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                tokenMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                tokenMove(1);

            }


            return;

        }


        if (
            state === STATES.REDEEM
        ) {

            /*
               Only use the arrow/W/S navigation
               when the user isn't using Ctrl.
            */

            if (
                event.ctrlKey ||
                event.metaKey
            ) {

                return;

            }


            if (
                key === "ArrowUp" ||
                key === "w" ||
                key === "W"
            ) {

                redeemMove(-1);

            }


            if (
                key === "ArrowDown" ||
                key === "s" ||
                key === "S"
            ) {

                redeemMove(1);

            }


            return;

        }

    }
);


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(
    dt
) {

    if (
        state === STATES.PLAYING
    ) {

        updatePlayer(dt);

        updateAI(dt);

        updateBall(dt);

    }

}


/* =========================================================
   MAIN LOOP
========================================================= */

let previousTime =
    performance.now();


function loop(
    now
) {

    let dt =
        (
            now -
            previousTime
        ) /
        1000;


    previousTime =
        now;


    if (
        dt > 0.033
    ) {

        dt = 0.033;

    }


    update(dt);

    updateCooldown(now);

    draw();


    requestAnimationFrame(
        loop
    );

}


draw();

requestAnimationFrame(
    loop
);

</script>
