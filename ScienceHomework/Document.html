<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#game {
    width: min(96vw, 1100px);
    height: auto;
    aspect-ratio: 16 / 10;
    background: #181818;
    border: 2px solid #444;
    display: block;
}

#info {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="info">PONG</div>

<canvas id="game" width="960" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


/* =========================================================
   GAME SETTINGS
========================================================= */

const WIDTH = 960;
const HEIGHT = 600;

const PADDLE_WIDTH = 18;
const PADDLE_HEIGHT = 110;

const PLAYER_X = 40;
const AI_X = WIDTH - 58;

const BALL_SIZE = 16;

const PLAYER_SPEED = 520;

const AI_SPEED = 390;


/* =========================================================
   GAME VARIABLES
========================================================= */

let playerY =
    HEIGHT / 2 -
    PADDLE_HEIGHT / 2;

let aiY =
    HEIGHT / 2 -
    PADDLE_HEIGHT / 2;

let playerScore = 0;
let aiScore = 0;

let ballX =
    WIDTH / 2;

let ballY =
    HEIGHT / 2;

let ballVX = 0;
let ballVY = 0;

let paused = false;

let gameStarted = false;


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[event.key] = true;

        if (
            event.key === " "
        ) {

            event.preventDefault();

            paused = !paused;

        }

        if (
            event.key === "r" ||
            event.key === "R"
        ) {

            resetGame();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[event.key] = false;

    }
);


/* =========================================================
   BALL RESET
========================================================= */

function resetBall(direction) {

    ballX =
        WIDTH / 2;

    ballY =
        HEIGHT / 2;


    const speed = 380;

    const angle =
        Math.random() * 0.8 - 0.4;


    ballVX =
        speed * direction;

    ballVY =
        speed * angle;

}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    playerScore = 0;
    aiScore = 0;

    playerY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;

    aiY =
        HEIGHT / 2 -
        PADDLE_HEIGHT / 2;

    paused = false;

    gameStarted = true;

    resetBall(
        Math.random() < 0.5
            ? -1
            : 1
    );

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt) {

    let movement = 0;


    if (
        keys["w"] ||
        keys["W"] ||
        keys["ArrowUp"]
    ) {

        movement -= 1;

    }


    if (
        keys["s"] ||
        keys["S"] ||
        keys["ArrowDown"]
    ) {

        movement += 1;

    }


    playerY +=
        movement *
        PLAYER_SPEED *
        dt;


    if (
        playerY < 0
    ) {

        playerY = 0;

    }


    if (
        playerY >
        HEIGHT -
        PADDLE_HEIGHT
    ) {

        playerY =
            HEIGHT -
            PADDLE_HEIGHT;

    }

}


/* =========================================================
   AI
========================================================= */

function updateAI(dt) {

    const target =
        ballY -
        PADDLE_HEIGHT / 2;


    if (
        aiY < target
    ) {

        aiY +=
            AI_SPEED *
            dt;

    }


    if (
        aiY > target
    ) {

        aiY -=
            AI_SPEED *
            dt;

    }


    if (
        aiY < 0
    ) {

        aiY = 0;

    }


    if (
        aiY >
        HEIGHT -
        PADDLE_HEIGHT
    ) {

        aiY =
            HEIGHT -
            PADDLE_HEIGHT;

    }

}


/* =========================================================
   BALL
========================================================= */

function updateBall(dt) {

    ballX +=
        ballVX *
        dt;

    ballY +=
        ballVY *
        dt;


    /* TOP */

    if (
        ballY -
        BALL_SIZE / 2 <=
        0
    ) {

        ballY =
            BALL_SIZE / 2;

        ballVY =
            Math.abs(ballVY);

    }


    /* BOTTOM */

    if (
        ballY +
        BALL_SIZE / 2 >=
        HEIGHT
    ) {

        ballY =
            HEIGHT -
            BALL_SIZE / 2;

        ballVY =
            -Math.abs(ballVY);

    }


    /* PLAYER PADDLE */

    if (
        ballVX < 0 &&
        ballX -
        BALL_SIZE / 2 <=
        PLAYER_X +
        PADDLE_WIDTH &&
        ballX +
        BALL_SIZE / 2 >=
        PLAYER_X &&
        ballY >=
        playerY &&
        ballY <=
        playerY +
        PADDLE_HEIGHT
    ) {

        ballX =
            PLAYER_X +
            PADDLE_WIDTH +
            BALL_SIZE / 2;


        const relative =
            (
                ballY -
                (
                    playerY +
                    PADDLE_HEIGHT / 2
                )
            ) /
            (
                PADDLE_HEIGHT / 2
            );


        const speed =
            Math.min(
                Math.hypot(
                    ballVX,
                    ballVY
                ) * 1.05,
                900
            );


        ballVX =
            speed;


        ballVY =
            relative *
            speed *
            0.8;

    }


    /* AI PADDLE */

    if (
        ballVX > 0 &&
        ballX +
        BALL_SIZE / 2 >=
        AI_X &&
        ballX -
        BALL_SIZE / 2 <=
        AI_X +
        PADDLE_WIDTH &&
        ballY >=
        aiY &&
        ballY <=
        aiY +
        PADDLE_HEIGHT
    ) {

        ballX =
            AI_X -
            BALL_SIZE / 2;


        const relative =
            (
                ballY -
                (
                    aiY +
                    PADDLE_HEIGHT / 2
                )
            ) /
            (
                PADDLE_HEIGHT / 2
            );


        const speed =
            Math.min(
                Math.hypot(
                    ballVX,
                    ballVY
                ) * 1.05,
                900
            );


        ballVX =
            -speed;


        ballVY =
            relative *
            speed *
            0.8;

    }


    /* PLAYER SCORED */

    if (
        ballX < -30
    ) {

        aiScore++;

        resetBall(1);

    }


    /* PLAYER SCORED */

    if (
        ballX >
        WIDTH + 30
    ) {

        playerScore++;

        resetBall(-1);

    }

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#181818";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.strokeStyle =
        "#333333";

    ctx.lineWidth = 2;

    ctx.setLineDash([
        12,
        14
    ]);


    ctx.beginPath();

    ctx.moveTo(
        WIDTH / 2,
        0
    );

    ctx.lineTo(
        WIDTH / 2,
        HEIGHT
    );

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.strokeStyle =
        "#444444";

    ctx.strokeRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground();


    /* PLAYER */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        PLAYER_X,
        playerY,
        PADDLE_WIDTH,
        PADDLE_HEIGHT
    );


    /* AI */

    ctx.fillRect(
        AI_X,
        aiY,
        PADDLE_WIDTH,
        PADDLE_HEIGHT
    );


    /* BALL */

    ctx.fillRect(
        ballX -
        BALL_SIZE / 2,
        ballY -
        BALL_SIZE / 2,
        BALL_SIZE,
        BALL_SIZE
    );


    /* SCORE */

    ctx.font =
        "bold 48px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        playerScore,
        WIDTH / 2 - 70,
        65
    );

    ctx.fillText(
        aiScore,
        WIDTH / 2 + 70,
        65
    );


    /* START MESSAGE */

    if (
        !gameStarted
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,0.7)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 40px Arial";

        ctx.fillText(
            "PONG",
            WIDTH / 2,
            HEIGHT / 2 - 50
        );


        ctx.font =
            "20px Arial";

        ctx.fillText(
            "Press ENTER to start",
            WIDTH / 2,
            HEIGHT / 2 + 5
        );


        ctx.font =
            "16px Arial";

        ctx.fillText(
            "W / S or ↑ / ↓ to move",
            WIDTH / 2,
            HEIGHT / 2 + 40
        );

    }


    /* PAUSE */

    if (
        paused &&
        gameStarted
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,0.65)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 40px Arial";

        ctx.fillText(
            "PAUSED",
            WIDTH / 2,
            HEIGHT / 2
        );

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (
        !gameStarted ||
        paused
    ) {

        return;

    }


    updatePlayer(dt);

    updateAI(dt);

    updateBall(dt);

}


/* =========================================================
   MAIN LOOP
========================================================= */

let previousTime =
    performance.now();


function loop(currentTime) {

    let dt =
        (
            currentTime -
            previousTime
        ) / 1000;


    previousTime =
        currentTime;


    if (
        dt > 0.033
    ) {

        dt = 0.033;

    }


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );

}


window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !gameStarted
        ) {

            resetGame();

        }

    }
);


draw();

requestAnimationFrame(
    loop
);

</script>

</body>
</html>
